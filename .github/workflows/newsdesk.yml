name: Newsdesk headline trigger

# Hourly headline-triggered bill resync (Part 2 of the 2026-07-16
# spend-reduction pair; Part 1 is the priority decode gate in
# scripts/sync-bills.mjs). Since 2026-07-23 it ingests TWO signal classes:
# tier-0 government feeds (Congress.gov floor-today/most-viewed RSS +
# docs.house.gov's weekly look-ahead floorschedule - explicit bill numbers,
# zero lean, fire without press corroboration, loudly logged) and a
# politically-balanced basket of free press RSS feeds (NO paid news API -
# see scripts/newsdesk.mjs's header comment), matched cheapest-tier-first;
# a press-derived match only acts on a bill that clears the
# >=2-distinct-outlet corroboration rule (or carries an explicit
# bill-number citation, which needs no corroboration).
#
# COST: expected ~$0.12/day Haiku (t3 disambiguation - most hourly runs'
# batch is empty, $0) + $0-0.45/day trigger decodes on a typical/busy day
# (tier-0 fires are almost always free refreshes of corpus bills);
# NEWSDESK_DAILY_DECODE_CAP=10 + NEWSDESK_TIER0_DAILY_DECODE_CAP=20
# (scripts/newsdesk.mjs) make the black-swan hard ceiling 30 decodes/day
# (~$2.10-4.50) code-enforced - inside the owner's all-in <$5/day
# directive. Actions minutes: $0 (public repo, unlimited free minutes on
# standard runners). Full typical/busy/hard-ceiling breakdown in
# scripts/newsdesk.mjs's header comment and the introducing PRs' reports.

on:
  schedule:
    - cron: '7 * * * *' # hourly, offset from the top of the hour
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # lets the workflow dispatch ci.yml after its own push

concurrency:
  # Shared with sync-bills.yml/hot-bills.yml/refresh-legislators.yml so this
  # can never race any of their commits to data/bills.json or data/bills-es.json.
  group: data-sync
  cancel-in-progress: false

jobs:
  newsdesk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        # Needs npm ci (not stdlib-only like hot-bills.yml): scripts/newsdesk.mjs
        # constructs its own Anthropic client for the t3 disambiguation call
        # and the (shared, bill-decode.mjs) decode-before-publish path.
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Restore seen-headlines cache
        # Ever-growing-cache pattern (GitHub Actions caches can't be
        # overwritten under the same key): restore-keys prefix-matches the
        # most recent previous run's exact key; the save step below always
        # writes a NEW run-scoped key. GitHub auto-evicts any cache entry
        # unused for 7 days, which is exactly the "7-day retention" the spec
        # asks for - no explicit TTL bookkeeping needed in the script itself.
        # A cache miss (first run ever, or a fully-evicted history) degrades
        # gracefully - see scripts/newsdesk.mjs's loadCache().
        uses: actions/cache/restore@v4
        with:
          path: .newsdesk-cache
          key: newsdesk-seen-${{ github.run_id }}
          restore-keys: |
            newsdesk-seen-
      - name: Collect floor signals (the T0 announcement layer)
        # Runs BEFORE the newsdesk, because the newsdesk's re-decode trigger
        # reads data/floor-signals.json to decide which bills are about to be
        # seen. Owns that file alone — no other step writes it, and it writes
        # nothing else.
        #
        # continue-on-error for the same reason the Moment-updates step below
        # carries it: a Congress.gov or docs.house.gov hiccup in the
        # announcement layer must never cost the run its bill refreshes. The
        # script already degrades internally (a dark source records
        # data_stale/error rather than a quiet week), so this only covers a
        # hard crash, and the next hourly run re-collects.
        #
        # Cost: $0 — four free requests (one docs.house.gov XML, two
        # Congress.gov API calls on the existing key, one congress.gov HTML
        # page). No model calls, ever: every word it stores is a verbatim
        # substring of a government document.
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node scripts/floor-signals.mjs
      - name: Run newsdesk
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/newsdesk.mjs
      - name: Collect Moment updates (Moments v2 live layer, incremental)
        # A SEPARATE step, not a change to scripts/newsdesk.mjs: the two
        # scripts own disjoint files (newsdesk owns bills.json/bills-es.json,
        # this owns moment-updates.json) and neither reads the other's state.
        # continue-on-error so a Congress.gov hiccup in the live layer can
        # never cost the run its bill refreshes — the collector is additive,
        # and the next hourly run re-collects whatever this one missed.
        # It writes NOTHING when nothing moved (no _meta restamp), which is
        # what keeps an hourly cron from becoming an hourly deploy.
        # Cost: ONE batched Haiku call per run, skipped entirely on an empty
        # batch — see scripts/moment-updates.mjs's SPEND section.
        continue-on-error: true
        env:
          MOMENT_UPDATES_MODE: incremental
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/moment-updates.mjs
      - name: Save seen-headlines cache
        # Always saves under this run's own unique key (see the restore
        # step's comment) - if: always() so a mid-run failure still persists
        # whatever cache state was written before the failure, rather than
        # losing dedupe progress on every transient error.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .newsdesk-cache
          key: newsdesk-seen-${{ github.run_id }}
      - name: Commit data
        id: commit
        # Same oravan-sync author + push-with-rebase-retry pattern as
        # sync-bills.yml/hot-bills.yml - the author email must map to the
        # Vercel-linked GitHub account or Vercel BLOCKs the auto-deploy
        # (docs/solutions/vercel-bot-push-blocked-deploys.md). Commits
        # ONLY when scripts/newsdesk.mjs actually changed data/ - an
        # hourly no-op run (the common case) must never produce a deploy.
        run: |
          git config user.name "oravan-sync"
          git config user.email "223600121+cm2489@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(data): newsdesk trigger $(date -u +%FT%HZ)"
          # This job touches data/bills.json/data/bills-es.json (no
          # sync-state.json, no coverage.json - see scripts/newsdesk.mjs's
          # Boundaries section) plus data/moment-updates.json from the
          # collector step above and data/floor-signals.json from the
          # announcement collector; `git add data/` already stages all of them
          # - disjoint from refresh-legislators.yml's
          # files but overlapping sync-bills.yml's/hot-bills.yml's, all of
          # which share this concurrency group. Rebase onto the latest main
          # and retry, same pattern as those workflows.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $i)"
            # Guarded: a bare `git fetch` under `bash -e` kills the step on the
            # spot, which would make these five attempts as decorative as
            # sync-bills.yml's were on 2026-08-07.
            if ! git fetch origin main; then
              echo "fetch failed (attempt $i) - retrying"
              continue
            fi
            if git rebase origin/main; then
              continue
            fi
            # A stopped rebase is NOT retryable: every later iteration fails
            # identically until the attempts run out, which is how run
            # 31194836148 burned all five in sync-bills.yml and left a
            # misleading "push rejected" as its last word. Fail here instead,
            # naming the files. Nothing is auto-resolvable in this job - it
            # never writes data/sync-state.json, the one flat key-value file
            # with a deterministic union (scripts/merge-sync-state.mjs, wired
            # into sync-bills.yml only).
            conflicted="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            git rebase --abort || true
            echo "::error::rebase conflict in: ${conflicted:-<unknown>} - a human must resolve it. The headlines and Moment updates this run collected are NOT committed."
            exit 1
          done
          exit 1
      - name: Verify the deploy landed
        # Same dead-man's-switch as sync-bills.yml/hot-bills.yml - poll
        # production until it serves the SHA we just pushed. A missing
        # PROD_URL repo variable FAILS this step rather than skipping it
        # (2026-08-12) - see scripts/verify-deploy.mjs's header.
        if: steps.commit.outputs.changed == 'true'
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          EXPECT_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/verify-deploy.mjs
      - name: Dispatch CI against the pushed data
        # Bot pushes (GITHUB_TOKEN) never trigger `on: push`, so without this
        # main's own suite never runs against a fresh corpus and test/corpus
        # drift lands on the next open PR instead (2026-07-25 incident).
        # Free on a public repo; the ci-refs/heads/main concurrency group
        # queues rather than cancels, so runs serialize harmlessly.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
