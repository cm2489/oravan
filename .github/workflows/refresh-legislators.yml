name: Weekly legislators refresh

on:
  schedule:
    - cron: '0 8 * * 1' # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # lets the workflow dispatch ci.yml after its own push
  # Needed for the "newly detected vacancy" issue below AND the standing
  # redistricting-watch issue (label upsert, body rewrite, one comment per
  # detecting run, plus the one-time rollover escalation) - all with the
  # workflow's own automatic GITHUB_TOKEN. A normal, expected vacancy or
  # map-page change must never commit/pass silently, so these surface as
  # labeled issues instead of failing the run. No new secret, no scope change
  # to GITHUB_FEEDBACK_TOKEN (that PAT stays issues-only for the
  # beta-feedback route and is unrelated to this).
  issues: write

concurrency:
  # ITS OWN GROUP since 2026-08-12 (owner ruling N8-B1). This job used to share
  # `data-sync` with sync-bills / newsdesk / hot-bills / moment-watch, and the
  # comment that justified it claimed serialization was what made its push
  # safe. It is not: a shared group keeps ONE run plus at most ONE pending run,
  # and a newly queued run EVICTS the older pending one. `cancel-in-progress:
  # false` protects the run that is executing, never the one waiting. newsdesk
  # is hourly, so the group gets a fresh challenger every ~60 minutes and
  # anything waiting longer than that is cancelled - observed on 2026-08-08,
  # when a newsdesk run sat pending 2,145s behind the nightly sync and ended
  # `cancelled`. A cancelled SCHEDULED run notifies nobody.
  #
  # This workflow is the worst possible victim of that: it runs WEEKLY, so a
  # miss costs two weeks of legislators/vacancies/ZIP data, skips a
  # redistricting-watch poll, and burns one of only ~5 Mondays in the
  # 119th->120th rollover tripwire's live window (lib/rollover-tripwire.mjs,
  # deadline 2027-01-03). It has already come within minutes twice: run
  # 29245921710 was held 42 minutes (2026-07-13) and run 28790519163 for 50
  # (2026-07-06), both inside the one-hour window a newsdesk run would have
  # displaced them in. It survived on cron drift, not on design.
  #
  # WHAT ACTUALLY MAKES THE PUSH SAFE, and it is already in this file: this
  # workflow's file set (legislators.json, zip-districts.json, vacancies.json,
  # redistricting-watch.json) is disjoint from every other data-sync member's,
  # and its commit step carries the 5-attempt rebase-and-retry loop below.
  # Disjoint files plus rebase-retry, not serialization.
  group: data-sync-legislators
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        # Only for the redistricting-watch + rollover-tripwire steps below
        # (scripts/check-redistricting-watch.mjs, scripts/check-rollover-
        # tripwire.mjs). Both are stdlib-only (Node 18+'s global fetch, no
        # npm package), so no `npm ci` here - same "the runner's node
        # suffices" posture as scripts/verify-deploy.mjs.
        with:
          node-version: 24
      - name: Refresh legislators + district offices + ZIP map (vacancy-diff included)
        id: refresh
        # scripts/process-data.py now also derives data/vacancies.json - see
        # scripts/vacancy_diff.py for the derivation (seat-set diff against
        # the currently-committed legislators.json + vacancies.json, never a
        # single legislator's own stale term data - the footgun this
        # replaces) and scripts/test_vacancy_diff.py for its fixtures.
        #
        # Loud-failure design, matching the dead-man's-switch pattern
        # scripts/verify-sync.mjs already uses for sync-bills.yml (fail
        # before commit on a severe, corruption-shaped drop; this workflow
        # adds a second, non-blocking channel for the normal case):
        #   - a handful of newly-detected vacancies (<= 5 in one run) is
        #     real, expected churn - the run does NOT fail, but the
        #     "Open an issue" step below surfaces it loudly instead of
        #     letting it commit silently.
        #   - more than 5 new vacancies in one run is treated as a
        #     truncated/broken upstream fetch, not reality (the project records §9.1(f)) - process-data.py
        #     exits 1 here, so nothing below this step runs and nothing
        #     commits.
        run: python3 scripts/process-data.py --download
      - name: Open an issue for newly detected vacancies
        # Only for the non-anomalous case (the step above already failed
        # and skipped everything downstream if it was anomalous). Each
        # newly-detected seat gets its own issue so it's easy to close
        # independently once a successor is sworn in; a chronic vacancy
        # already on record from a prior run is never re-filed (process-
        # data.py only reports the seats first observed vacant THIS run).
        if: steps.refresh.outputs.anomalous_vacancy_shrink == 'false' && steps.refresh.outputs.newly_detected_vacancies != '[]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VACANCIES: ${{ steps.refresh.outputs.newly_detected_vacancies }}
        run: |
          echo "$VACANCIES" | jq -c '.[]' | while read -r v; do
            state=$(echo "$v" | jq -r '.state')
            district=$(echo "$v" | jq -r '.district')
            gh issue create \
              --repo cm2489/oravan \
              --title "Vacant seat detected: ${state}-${district}" \
              --label data-vacancy \
              --body "The weekly legislators refresh found no current representative for ${state} district ${district} in this week's pull. This is never silently backfilled from the departed member's stale record - rep-lookup surfaces (reps page, /api/reps, MCP lookup_representatives) now show an explicit vacant-seat state for this district instead. Close this once a successor is sworn in and data/vacancies.json no longer lists the seat (it heals automatically on the next refresh once the new member appears in the upstream feed)."
          done
      - name: Poll Redistricting Data Hub for tracked-state map changes
        id: redistricting_watch
        # S24, §9.1(f) item 3 - see lib/redistricting-watch.mjs and
        # docs/solutions/two-clock-district-boundaries.md for the full
        # design record. RDH publishes no RSS/JSON/API for its "What's New"
        # page (verified live 2026-07-06) - this polls the per-state
        # <lastmod> in RDH's own WordPress XML sitemap instead: real,
        # scoped to exactly the tracked states, machine-parseable, and
        # explicitly a TRIPWIRE (not a status feed) - a lastmod change means
        # "a human should go read what changed," never an automated status
        # update. Loud-failure posture matches vacancy_diff.py: fails (exit
        # 1, no baseline update) only if every tracked state comes back
        # missing (RDH restructured the sitemap, or the fetch itself broke)
        # - not real news.
        run: node scripts/check-redistricting-watch.mjs
      - name: Update the standing redistricting-watch issue; escalate at rollover
        # Replaces a per-state `gh issue create` loop that had NO issue-level
        # dedupe: the only dedupe was value-level (the committed rdh_lastmod
        # advances, so the same hop never re-fires), which is correct tripwire
        # behaviour and still left ten open issues in six weeks (#92,
        # #119-#126, #149) - eight of
        # them from one upstream event, RDH bulk-touching eight state pages
        # within 28 minutes on 2026-07-24 (#119-#126). Nothing reads those
        # issues (no product code, no workflow, no MCP tool), so their only
        # job is to be READ, and ten near-identical titles is worse at
        # that job than one. Now: one rolling PINNED issue whose body is
        # rewritten from data/redistricting-watch.json every run, plus one
        # comment per run that detected something. Same pattern
        # daily-metrics.yml already ships (its "Ensure labels + pinned digest
        # issue exist" step).
        #
        # The label upsert is deliberate, not decoration: `gh issue create
        # --label X` FAILS when X doesn't exist, and redistricting-watch was
        # created out-of-band by hand, not by committed code - exactly the
        # footgun STATUS.md records for data-vacancy in #40. `gh label create
        # --force` is a no-op upsert, so the dependency is now in the repo.
        #
        # `if: always()` for the same reason the rollover-tripwire step below
        # has it, and it matters more here: this step now also owns the DATED
        # escalation. Under GitHub's default `if: success()` a Census download
        # failure upstream, or the redistricting-watch step's by-design exit 1
        # when RDH restructures their sitemap, would silently skip the Jan 3,
        # 2027 deadline every week until a human noticed. The watch half is
        # instead guarded on the step outputs in shell (both are empty strings
        # when that step never ran), so a failed run updates nothing but can
        # still escalate. Pinned by tests/rollover-tripwire.unit.spec.ts.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANOMALOUS: ${{ steps.redistricting_watch.outputs.anomalous }}
          CHANGED: ${{ steps.redistricting_watch.outputs.changed_states }}
        run: |
          set -euo pipefail
          gh label create redistricting-watch --color 5319E7 \
            --description "RDH map-page tripwire (standing issue)" --force

          # ANOMALOUS is '' when the poll never ran at all (an upstream step
          # failed under this step's `if: always()`), 'true' when RDH's
          # sitemap came back structurally broken. Either way the committed
          # watch file is not a current picture, so publish nothing from it -
          # the exit 1 upstream is already the loud channel - and fall
          # through to the dated escalation, which must not depend on RDH.
          if [ "$ANOMALOUS" = 'false' ]; then
            node scripts/render-redistricting-issue.mjs board "$RUNNER_TEMP/board.md"

            # jq picks the first exact-title match rather than piping through
            # `head`, which under `pipefail` would SIGPIPE `gh` into failing.
            NUM=$(gh issue list --repo cm2489/oravan --state open \
                  --search 'in:title "Redistricting watch (standing)"' --json number,title \
                  --jq 'map(select(.title=="Redistricting watch (standing)")) | .[0].number // empty')
            if [ -z "$NUM" ]; then
              # Created WITH the board as its body - never a placeholder that
              # could survive as the visible body if a later run goes wrong.
              NUM=$(gh issue create --repo cm2489/oravan \
                    --title "Redistricting watch (standing)" --label redistricting-watch \
                    --body-file "$RUNNER_TEMP/board.md" | grep -oE '[0-9]+$')
              gh issue pin --repo cm2489/oravan "$NUM" || true
            else
              gh issue edit "$NUM" --repo cm2489/oravan --body-file "$RUNNER_TEMP/board.md"
            fi

            if [ "$CHANGED" != '[]' ]; then
              node scripts/render-redistricting-issue.mjs comment "$RUNNER_TEMP/comment.md"
              gh issue comment "$NUM" --repo cm2489/oravan --body-file "$RUNNER_TEMP/comment.md"
            fi
          fi

          # 119th -> 120th rollover escalation. Dated gate, not event-driven:
          # lib/rollover-tripwire.mjs's rolloverWarning() decides, and the
          # renderer reports its verdict as a WORD, never an exit code, so a
          # crash here fails the step loudly instead of reading as "not yet
          # due". Searched --state all so this is opened exactly ONCE ever -
          # closing it after the bump lands must not re-file it next Monday.
          DUE=$(node scripts/render-redistricting-issue.mjs rollover "$RUNNER_TEMP/rollover.md")
          if [ "$DUE" = 'due' ]; then
            EXISTING=$(gh issue list --repo cm2489/oravan --state all \
                       --search 'in:title "Bump Clock 1 to the 120th Congress"' --json number,title \
                       --jq 'map(select(.title=="Bump Clock 1 to the 120th Congress before Jan 3, 2027")) | .[0].number // empty')
            if [ -z "$EXISTING" ]; then
              gh issue create --repo cm2489/oravan \
                --title "Bump Clock 1 to the 120th Congress before Jan 3, 2027" \
                --label redistricting-watch --body-file "$RUNNER_TEMP/rollover.md"
            fi
          fi
      - name: 119th -> 120th Congress rollover tripwire
        # S24, two-clock model (docs/solutions/two-clock-district-
        # boundaries.md). Non-blocking by design: the mandatory literal +
        # dataset bump isn't due until Jan 3, 2027, so this only starts a
        # loud ::warning once real lead time is needed (~2026-12-01) rather
        # than failing the pipeline for a month first. See
        # lib/rollover-tripwire.mjs.
        #
        # `if: always()` DELIBERATELY decouples this step from everything
        # above it. Without it, GitHub's default `if: success()` chains a
        # hard, dated, non-negotiable deadline (Jan 3, 2027) to two unrelated
        # external dependencies that sit upstream in this same job:
        # process-data.py's download, and - worse - the redistricting-watch
        # step, which exits 1 by design when EVERY tracked state comes back
        # missing. That anomaly means "Redistricting Data Hub restructured
        # their sitemap", i.e. someone else changed their website. It stays
        # broken until a human notices, and every week it stays broken is a
        # week the rollover warning is silently skipped - exactly the
        # forgotten-mandatory-edit failure this tripwire exists to prevent.
        #
        # Safe because the script cannot fail the workflow: it calls
        # rolloverWarning() and prints either a ::warning or a "not yet due"
        # line, with no process.exit and no throw path
        # (scripts/check-rollover-tripwire.mjs, lib/rollover-tripwire.mjs).
        # So running it unconditionally can only ADD a warning to a run that
        # was already failing for other reasons; it can never turn a red run
        # green or a green run red. Reordering the steps was the alternative
        # and was rejected: it would churn step order for no other reason,
        # and would still leave whichever step ended up last coupled to the
        # ones before it. Pinned by tests/rollover-tripwire.unit.spec.ts.
        if: always()
        run: node scripts/check-rollover-tripwire.mjs
      - name: Commit data
        id: commit
        # The author email must map to the Vercel-linked GitHub account
        # (cm2489): Vercel BLOCKs auto-deploys for commits from unlinked
        # authors, and — proven by the 2026-07-02 nightly run — deploy hooks
        # do NOT bypass that check; the hook's deployment of the same commit
        # was BLOCKED identically. Authoring as the linked account lets the
        # normal git-integration deploy proceed.
        # See docs/solutions/vercel-bot-push-blocked-deploys.md.
        run: |
          git config user.name "oravan-sync"
          git config user.email "223600121+cm2489@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(data): weekly legislators refresh $(date -u +%F)"
          # The scheduled run's checked-out base can be stale by the time this
          # job starts - main moves under us whether or not we are serialised
          # against it, and since 2026-08-12 this workflow is in its OWN
          # concurrency group (see the header), so a data-sync push can now
          # land DURING this run rather than only before it. THIS LOOP IS WHAT
          # MAKES THAT SAFE, together with the disjoint file set: this workflow
          # only ever touches legislators.json / zip-districts.json /
          # vacancies.json / redistricting-watch.json, none of which any other
          # workflow writes, so a concurrent push is a fast-forward problem and
          # never a content conflict. (The 2026-06-22 failure is the reason the
          # loop exists; leaving the shared group is the reason it is now the
          # only thing standing there.)
          for i in 1 2 3 4 5; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $i)"
            # Guarded: a bare `git fetch` under `bash -e` kills the step on the
            # spot, which would make these five attempts as decorative as
            # sync-bills.yml's were on 2026-08-07.
            if ! git fetch origin main; then
              echo "fetch failed (attempt $i) - retrying"
              continue
            fi
            if git rebase origin/main; then
              continue
            fi
            # A stopped rebase is NOT retryable: every later iteration fails
            # identically until the attempts run out, which is how run
            # 31194836148 burned all five in sync-bills.yml and left a
            # misleading "push rejected" as its last word. Fail here instead,
            # naming the files. Nothing is auto-resolvable in this job - it
            # never writes data/sync-state.json, the one flat key-value file
            # with a deterministic union (scripts/merge-sync-state.mjs, wired
            # into sync-bills.yml only).
            conflicted="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            git rebase --abort || true
            echo "::error::rebase conflict in: ${conflicted:-<unknown>} - a human must resolve it. The legislator/ZIP refresh this run collected is NOT committed."
            exit 1
          done
          exit 1
      - name: Verify the deploy landed
        # The push above triggers Vercel's git-integration deploy (the commit
        # author is linked, so it is no longer BLOCKED). Deploys can still fail
        # or be dropped silently (PR #18's root cause hid for weeks behind
        # green checkmarks) - poll production until it serves the SHA we just
        # pushed. A missing PROD_URL repo variable FAILS this step rather than
        # skipping it (2026-08-12) - see scripts/verify-deploy.mjs's header.
        # Stdlib-only script: needs no npm ci, the runner's node suffices.
        if: steps.commit.outputs.changed == 'true'
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          EXPECT_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/verify-deploy.mjs
      - name: Dispatch CI against the pushed data
        # Bot pushes (GITHUB_TOKEN) never trigger `on: push`, so without this
        # main's own suite never runs against a fresh corpus and test/corpus
        # drift lands on the next open PR instead (2026-07-25 incident).
        # Free on a public repo; the ci-refs/heads/main concurrency group
        # queues rather than cancels, so runs serialize harmlessly.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
