name: Moment watch

# Delivery for the Big Question candidate shortlist (owner decision, 2026-08-05).
#
# WHY: scripts/moment-candidates.mjs has produced a complete, correct ranked
# report since it was written, and was referenced by no workflow and no npm
# script. It ran only when someone typed it, and nobody did — so 38 qualified
# candidates sat unread while the two live Moments aged. The report was never
# the missing piece; delivery was.
#
# TWO CADENCES, ONE FILE. `github.event.schedule` selects the mode:
#   - nightly  -> --mode=push    : opens ONE issue per NEWLY-qualifying bill,
#                                  and stays silent when nothing crossed the
#                                  floor. Silence is the signal.
#   - Mondays  -> --mode=weekly  : updates ONE standing issue with the whole
#                                  shortlist, what changed, what is expiring,
#                                  and every below-the-floor exclusion with its
#                                  reason, so the floor stays auditable.
#
# COST: NOT $0 any more, as of 2026-08-07. This header advertised "$0. Zero
# network, zero AI, zero paid API" and that stopped being true the moment
# scripts/moment-draft.mjs started writing the first draft of each scaffold's
# prose with claude-sonnet-5. The real number, so nobody has to guess:
#
#   ONE call per candidate whose scaffold a run actually RENDERS, plus at most
#   one retry when a field fails the lint. Measured on the s-3172-119
#   candidate: ~1,230 input + ~480 output tokens per call (chars / 3.6, which
#   allows for Sonnet 5's heavier tokenizer — an estimate, NOT a count_tokens
#   measurement) = ~$0.011 at list ($3 / $15 per MTok), ~$0.007 at the
#   introductory rate that runs to 2026-08-31.
#
#     quiet night, nothing crossed the floor .... $0.00  (no call is made)
#     3-candidate night (today's backlog) ....... ~$0.03, ~$0.07 if all retried
#     hard per-run ceiling, MOMENT_DRAFT_CAP=10 . ~$0.22
#     realistic month, 10 pushes + 4 digests .... ~$0.25
#
#   Three things deliberately spend nothing: `--json` (it renders no
#   scaffold), a weekly digest with nothing above the floor, and the seen-set
#   commit (it passes --no-draft AND is not given the key). The API key is
#   scoped to the two steps that render an issue body, never to the whole job.
#
# Actions minutes are still free on a public repo (standard runners).
#
# THE BOUNDARY MOVED, and it is worth stating precisely. This still proposes
# nothing and publishes nothing: no step here writes data/moments.json, and a
# Big Question exists only when the owner edits a draft and opens a PR that
# scripts/check-moments.mjs then gates. What changed is that the three prose
# slots arrive filled with a labelled, lint-checked AI first draft instead of
# empty — the owner's ruling of 2026-08-07: "I want to review and edit the
# writing and the choice of what goes up. I don't actually want to write
# them." `moments.howMadeBody`'s "reviewed by a person before it publishes"
# stays true, because that review and that merge are the whole job.

on:
  schedule:
    - cron: '20 11 * * *' # 11:20 UTC daily = 7:20am ET — after the nightly sync
      #                     has committed, so the watcher always reads fresh
      #                     bill statuses and coverage. Lands in time to be
      #                     reviewed with morning coffee.
      #
      #                     SIZED AGAINST OBSERVED TIMES, NOT NOMINAL ONES:
      #                     sync-bills is nominally '30 7 * * *' but GitHub has
      #                     been starting it ~10:05 UTC and it runs ~12 min. A
      #                     cron here drifts the same way, landing ~13:50 — still
      #                     after the sync's real window, still before hot-bills
      #                     at 17:00. Don't re-derive this slot from the nominal
      #                     07:30; the margin is against the observed 10:05-10:17.
    - cron: '0 13 * * 1' # 13:00 UTC Monday = 9:00am ET — the weekly review.
  workflow_dispatch:
    inputs:
      mode:
        description: 'push | weekly'
        required: false
        default: 'push'

permissions:
  contents: write # commits data/candidates-seen.json
  issues: write # opens/updates the candidate issues

concurrency:
  # Shared with sync-bills.yml / newsdesk.yml / hot-bills.yml /
  # refresh-legislators.yml so a seen-set commit can never race their commits
  # to data/. This workflow only ever writes data/candidates-seen.json, but the
  # push itself still has to be serialised against theirs.
  group: data-sync
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev
        # This job WAS dependency-free — moment-watch.mjs and the
        # moment-candidates.mjs it imports are stdlib-only, and the old comment
        # here said installing anything "would add a minute to a job that needs
        # none". Drafting needs @anthropic-ai/sdk, so it needs one now.
        # `--omit=dev` because nothing in this job builds, types, or tests:
        # it skips Playwright's browser download and sharp, which are the two
        # slow installs in this lockfile.
        #
        # scripts/moment-watch.mjs imports the SDK DYNAMICALLY and treats a
        # failed import as "no drafting today", so if this step is ever
        # removed or fails the watcher still delivers the shortlist.

      - name: Select mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 13 * * 1" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=push" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure this workflow's own labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        # A workflow that opens labelled issues must own its labels. `gh issue
        # create --label X` fails hard when X does not exist, and that has now
        # bitten this repo TWICE: #40 shipped `--label data-vacancy` without
        # creating it, the learning went into STATUS.md, and this workflow then
        # shipped two uncreated labels anyway. A process control that fails
        # after being written down becomes a mechanism. --force is idempotent,
        # and it puts the colour and description under version control, which
        # creating them by hand does not.
        run: |
          gh label create moment-candidate --color 0E8A16 --force \
            --description "A bill cleared the Moment notification floor - owner decides"
          gh label create moment-review --color 1D76DB --force \
            --description "The standing weekly Moment shortlist digest"

      - name: Build report
        id: report
        # Writes new_count to $GITHUB_OUTPUT. Does NOT advance the seen-set —
        # that happens only after an issue is actually opened, so a failure
        # between here and there can never silently swallow a candidate.
        #
        # --json ONLY, and no API key on this step. It used to also render the
        # markdown digest here, which was dead output in push mode (the loop
        # below re-renders per candidate) — harmless when rendering was free,
        # and a full duplicate set of drafting calls now that it is not.
        run: |
          node scripts/moment-watch.mjs --mode=${{ steps.mode.outputs.mode }} --json > /tmp/report.json
          cat /tmp/report.json

      - name: Open an issue per new candidate
        id: file
        if: steps.mode.outputs.mode == 'push' && steps.report.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          # The ONLY steps that get the key are the two that render an issue
          # body. Absent it, scripts/moment-draft.mjs falls back to the blank
          # scaffold and the issue still opens — the degrade path, wired as the
          # default rather than as a promise.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # One issue per candidate, not one rolling issue: each can be closed
        # independently as it is accepted or declined, and closing IS the
        # decline action. Each --only render is also exactly one drafting call.
        #
        # THE LOOP SURVIVES ITS OWN FAILURES, and that is the whole point of
        # its shape. It used to be a bare `create` under `bash -e`: one failed
        # call would kill the step, the seen-set commit below would never run,
        # and the next run would re-file EVERY candidate — including the ones
        # whose issues had been created a second earlier. That is the same
        # destination #167–#169 → #173–#175 reached through a different door
        # (see the commit step below); this door was never observed to open,
        # which is exactly why it stayed open through #176's fix.
        # So each candidate is now recorded pass/fail without dying, `filed` is
        # handed to --commit-seen as a delivery receipt, and the run is failed
        # afterwards (the step after the commit) rather than here. A red run
        # with the successes committed is strictly better than a red run that
        # re-notifies work already delivered.
        #
        # The pre-check is the second line of defence. The seen-set is the
        # first, but it is only as good as the commit that follows — a rebase
        # conflict below exits 1 with the set uncommitted, on purpose. In that
        # window the issue titles themselves are the record: they are exactly
        # "Big Question candidate: <slug>", they are unique per candidate, and
        # `--state all` counts a CLOSED one too, because closing an issue is
        # how the owner declines a candidate. An already-existing issue counts
        # as filed, spends no drafting call, and opens no duplicate.
        run: |
          slugs="$(node -e "console.log(require('/tmp/report.json').newly.join(' '))")"
          gh issue list --label moment-candidate --state all --limit 500 \
            --json title --jq '.[].title' > /tmp/filed-titles.txt
          filed=""
          failed=""
          for slug in $slugs; do
            if grep -Fxq "Big Question candidate: $slug" /tmp/filed-titles.txt; then
              echo "$slug already has an issue — counting it as filed, not re-filing it"
              filed="${filed:+$filed,}$slug"
              continue
            fi
            if node scripts/moment-watch.mjs --mode=push --only="$slug" > "/tmp/$slug.md" \
              && gh issue create \
                --title "Big Question candidate: $slug" \
                --label moment-candidate \
                --body-file "/tmp/$slug.md"; then
              filed="${filed:+$filed,}$slug"
            else
              failed="${failed:+$failed,}$slug"
              echo "::error::could not file the issue for ${slug} — it is held OUT of the seen-set and retries on the next run"
            fi
          done
          echo "filed=$filed" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Update the standing weekly issue
        if: steps.mode.outputs.mode == 'weekly'
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Updates in place rather than opening a new issue each Monday: the
        # thread becomes a running record and notifications stay quiet.
        #
        # The digest renders here, not in "Build report", so the drafting spend
        # happens once and only for the candidates this digest actually
        # scaffolds. Nothing above the floor => no scaffold => no call.
        run: |
          node scripts/moment-watch.mjs --mode=weekly > /tmp/report.md
          existing=$(gh issue list --label moment-review --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/report.md
            gh issue comment "$existing" --body "Refreshed $(date -u +%Y-%m-%d)."
          else
            gh issue create --title "Moment review (standing)" --label moment-review --body-file /tmp/report.md
          fi

      - name: Commit the seen-set
        if: steps.mode.outputs.mode == 'push'
        env:
          # The delivery receipt from the step above: the slugs whose issue is
          # confirmed to exist. Read through the environment rather than
          # interpolated into the script body, so nothing derived from data/
          # can ever be spliced into a shell command. Empty when that step was
          # skipped (nothing was newly qualifying), which is also correct —
          # scripts/moment-watch.mjs holds back only slugs it OWED an issue.
          FILED: ${{ steps.file.outputs.filed }}
        # Only for the candidates whose issues exist. Rebase-and-retry mirrors
        # the other data workflows: a nightly sync commit may have landed while
        # this ran.
        #
        # THE AUTHOR IS LOAD-BEARING, NOT COSMETIC. Vercel's GitHub integration
        # only auto-deploys a push whose commit author has a linked Vercel
        # account; a github-actions[bot] author is silently ignored. This repo
        # already paid ten days of broken deploys for that lesson — see
        # docs/solutions/vercel-bot-push-blocked-deploys.md. Every sibling data
        # workflow commits as oravan-sync for exactly this reason; so does this.
        #
        # TWO DELIBERATE DIVERGENCES from the sibling data workflows, both safe
        # because of WHAT this workflow writes:
        #   - no scripts/verify-deploy.mjs poll. data/candidates-seen.json is
        #     never read at build time, never rendered, and never read by a test
        #     — nothing about a deploy of it can be verified or needs to be.
        #   - no `gh workflow run ci.yml` dispatch, and no `actions: write`.
        #     The siblings dispatch CI because a bot push to data/ suppresses
        #     `on: push` and their corpus changes can redden tests. This file is
        #     invisible to the suite, so a CI run against it would prove nothing.
        # If this workflow ever writes anything the app reads, both come back.
        #   - --no-draft, and no ANTHROPIC_API_KEY on this step. The render this
        #     invocation produces is thrown away; without both of those it would
        #     silently pay for a second full set of drafts to write /dev/null.
        run: |
          node scripts/moment-watch.mjs --mode=push --commit-seen --no-draft --filed="$FILED" > /dev/null
          # TWO WAYS THE SEEN-SET FAILS TO REACH `main`, and every duplicate
          # issue this workflow has ever opened comes from one of them.
          #
          #   1. WHAT ACTUALLY HAPPENED. This guard was `git diff`, which
          #      exits 0 for an UNTRACKED file — and the first run that ever
          #      writes the seen-set is exactly that state, so the commit was
          #      skipped forever and the same candidates re-filed nightly:
          #      #167–#169 came back as #173–#175. `status --porcelain` sees
          #      new and modified alike (#176, 2026-08-08).
          #   2. WHAT #176 LEFT OPEN. The issue loop above ran under `bash -e`
          #      with a bare `gh issue create`, so one failed call would kill
          #      the step and this one would never run at all — leaving every
          #      candidate unseen, including those whose issues HAD been
          #      created. Never observed; identical outcome (2026-08-08).
          #
          # They are closed differently on purpose: (1) was a wrong command,
          # (2) was a wrong invariant. The invariant is now written down and
          # enforced in one place — a slug is committed as seen only if its
          # issue exists, which is what `--filed` carries
          # (scripts/moment-watch.mjs seenSetAfter, pinned by
          # tests/moment-watch-seen.unit.spec.ts).
          if [ -z "$(git status --porcelain -- data/candidates-seen.json)" ]; then
            echo "seen-set unchanged"
            exit 0
          fi
          git config user.name  "oravan-sync"
          git config user.email "223600121+cm2489@users.noreply.github.com"
          git add data/candidates-seen.json
          git commit -m "chore(data): moment candidates seen-set $(date -u +%Y-%m-%d)"
          # PUSH FIRST, THEN FETCH, THEN REBASE - three separate outcomes,
          # because they need three different answers. This was the one
          # rebase-retry block of the five data workflows that ran them as a
          # single `git pull --rebase`, so ANY non-zero exit - a transient
          # GitHub 500 on the fetch half, a dropped connection, a DNS blip -
          # was reported as "rebase conflict in: <unknown> - a human must
          # resolve it" and burned every remaining attempt on a network
          # hiccup the very next attempt would have survived. `<unknown>` was
          # the tell: `git diff --diff-filter=U` finds no unmerged paths
          # because there was no rebase. Split the same way sync-bills.yml,
          # hot-bills.yml, newsdesk.yml and refresh-legislators.yml do
          # (2026-08-09).
          #
          # A stopped rebase, by contrast, is NOT retryable: the `&&` chain
          # used to swallow the conflict and every later iteration then failed
          # identically on "rebase in progress" until the attempts ran out -
          # the shape that cost run 31194836148 its whole night in
          # sync-bills.yml. Fail on the spot instead, naming the file. There is
          # nothing auto-resolvable here: this job writes only
          # data/candidates-seen.json, never data/sync-state.json, so it has no
          # flat key-value state for scripts/merge-sync-state.mjs to union.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing onto latest ${GITHUB_REF_NAME} (attempt $i)"
            if ! git fetch origin "${GITHUB_REF_NAME}"; then
              echo "fetch failed (attempt $i) - retrying"
              continue
            fi
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              continue
            fi
            conflicted="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            git rebase --abort || true
            echo "::error::rebase conflict in: ${conflicted:-<unknown>} - a human must resolve it. The seen-set this run collected is NOT committed."
            exit 1
          done
          exit 1

      - name: Fail the run if any candidate could not be filed
        # LAST, deliberately. The loop above swallows a per-candidate failure so
        # that the commit step still runs and the successes are recorded; the
        # run still has to go red, or a silently-half-delivered night looks like
        # a quiet one. Putting the failure here rather than in the loop is what
        # orders those two: commit what was delivered, THEN complain.
        #
        # No `if: always()` anywhere in this job, on purpose. Every step keeps
        # GitHub's implicit `success()` gate, so a genuine failure earlier
        # (report build, issue listing) skips the seen-set commit entirely and
        # nothing is marked delivered — which is the safe direction. `always()`
        # on the commit step would invert that.
        if: steps.mode.outputs.mode == 'push' && steps.file.outputs.failed != ''
        env:
          FAILED: ${{ steps.file.outputs.failed }}
        run: |
          echo "::error::no issue was filed for: ${FAILED}. They were held out of the seen-set and will be retried on the next run; every candidate that WAS filed is committed and will not re-file."
          exit 1
