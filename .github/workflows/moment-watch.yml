name: Moment watch

# Delivery for the Big Question candidate shortlist (owner decision, 2026-08-05).
#
# WHY: scripts/moment-candidates.mjs has produced a complete, correct ranked
# report since it was written, and was referenced by no workflow and no npm
# script. It ran only when someone typed it, and nobody did — so 38 qualified
# candidates sat unread while the two live Moments aged. The report was never
# the missing piece; delivery was.
#
# TWO CADENCES, ONE FILE. `github.event.schedule` selects the mode:
#   - nightly  -> --mode=push    : opens ONE issue per NEWLY-qualifying bill,
#                                  and stays silent when nothing crossed the
#                                  floor. Silence is the signal.
#   - Mondays  -> --mode=weekly  : updates ONE standing issue with the whole
#                                  shortlist, what changed, what is expiring,
#                                  and every below-the-floor exclusion with its
#                                  reason, so the floor stays auditable.
#
# COST: $0. Zero network, zero AI, zero paid API — scripts/moment-watch.mjs
# reads only files already in the repo. Actions minutes are free on a public
# repo (standard runners).
#
# THE BOUNDARY IS UNCHANGED. This never drafts a Moment. The scaffold in each
# issue carries only facts copied from the official record; every user-facing
# sentence is left empty for the owner to write in both languages, which is
# what keeps `moments.howMadeBody` true.

on:
  schedule:
    - cron: '20 11 * * *' # 11:20 UTC daily = 7:20am ET — after the nightly sync
      #                     has committed, so the watcher always reads fresh
      #                     bill statuses and coverage. Lands in time to be
      #                     reviewed with morning coffee.
      #
      #                     SIZED AGAINST OBSERVED TIMES, NOT NOMINAL ONES:
      #                     sync-bills is nominally '30 7 * * *' but GitHub has
      #                     been starting it ~10:05 UTC and it runs ~12 min. A
      #                     cron here drifts the same way, landing ~13:50 — still
      #                     after the sync's real window, still before hot-bills
      #                     at 17:00. Don't re-derive this slot from the nominal
      #                     07:30; the margin is against the observed 10:05-10:17.
    - cron: '0 13 * * 1' # 13:00 UTC Monday = 9:00am ET — the weekly review.
  workflow_dispatch:
    inputs:
      mode:
        description: 'push | weekly'
        required: false
        default: 'push'

permissions:
  contents: write # commits data/candidates-seen.json
  issues: write # opens/updates the candidate issues

concurrency:
  # Shared with sync-bills.yml / newsdesk.yml / hot-bills.yml /
  # refresh-legislators.yml so a seen-set commit can never race their commits
  # to data/. This workflow only ever writes data/candidates-seen.json, but the
  # push itself still has to be serialised against theirs.
  group: data-sync
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
        # No npm ci: scripts/moment-watch.mjs and the moment-candidates.mjs it
        # imports are stdlib-only by design (zero network, zero AI). Installing
        # dependencies here would add a minute to a job that needs none.

      - name: Select mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 13 * * 1" ]; then
            echo "mode=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=push" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure this workflow's own labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        # A workflow that opens labelled issues must own its labels. `gh issue
        # create --label X` fails hard when X does not exist, and that has now
        # bitten this repo TWICE: #40 shipped `--label data-vacancy` without
        # creating it, the learning went into STATUS.md, and this workflow then
        # shipped two uncreated labels anyway. A process control that fails
        # after being written down becomes a mechanism. --force is idempotent,
        # and it puts the colour and description under version control, which
        # creating them by hand does not.
        run: |
          gh label create moment-candidate --color 0E8A16 --force \
            --description "A bill cleared the Moment notification floor - owner decides"
          gh label create moment-review --color 1D76DB --force \
            --description "The standing weekly Moment shortlist digest"

      - name: Build report
        id: report
        # Writes new_count to $GITHUB_OUTPUT. Does NOT advance the seen-set —
        # that happens only after an issue is actually opened, so a failure
        # between here and there can never silently swallow a candidate.
        run: |
          node scripts/moment-watch.mjs --mode=${{ steps.mode.outputs.mode }} > /tmp/report.md
          node scripts/moment-watch.mjs --mode=${{ steps.mode.outputs.mode }} --json > /tmp/report.json
          cat /tmp/report.json

      - name: Open an issue per new candidate
        if: steps.mode.outputs.mode == 'push' && steps.report.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        # One issue per candidate, not one rolling issue: each can be closed
        # independently as it is accepted or declined, and closing IS the
        # decline action.
        run: |
          for slug in $(node -e "console.log(require('/tmp/report.json').newly.join(' '))"); do
            node scripts/moment-watch.mjs --mode=push --only="$slug" > "/tmp/$slug.md"
            gh issue create \
              --title "Big Question candidate: $slug" \
              --label moment-candidate \
              --body-file "/tmp/$slug.md"
          done

      - name: Update the standing weekly issue
        if: steps.mode.outputs.mode == 'weekly'
        env:
          GH_TOKEN: ${{ github.token }}
        # Updates in place rather than opening a new issue each Monday: the
        # thread becomes a running record and notifications stay quiet.
        run: |
          existing=$(gh issue list --label moment-review --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file /tmp/report.md
            gh issue comment "$existing" --body "Refreshed $(date -u +%Y-%m-%d)."
          else
            gh issue create --title "Moment review (standing)" --label moment-review --body-file /tmp/report.md
          fi

      - name: Commit the seen-set
        if: steps.mode.outputs.mode == 'push'
        # Only after the issues exist. Rebase-and-retry mirrors the other data
        # workflows: a nightly sync commit may have landed while this ran.
        #
        # THE AUTHOR IS LOAD-BEARING, NOT COSMETIC. Vercel's GitHub integration
        # only auto-deploys a push whose commit author has a linked Vercel
        # account; a github-actions[bot] author is silently ignored. This repo
        # already paid ten days of broken deploys for that lesson — see
        # docs/solutions/vercel-bot-push-blocked-deploys.md. Every sibling data
        # workflow commits as oravan-sync for exactly this reason; so does this.
        #
        # TWO DELIBERATE DIVERGENCES from the sibling data workflows, both safe
        # because of WHAT this workflow writes:
        #   - no scripts/verify-deploy.mjs poll. data/candidates-seen.json is
        #     never read at build time, never rendered, and never read by a test
        #     — nothing about a deploy of it can be verified or needs to be.
        #   - no `gh workflow run ci.yml` dispatch, and no `actions: write`.
        #     The siblings dispatch CI because a bot push to data/ suppresses
        #     `on: push` and their corpus changes can redden tests. This file is
        #     invisible to the suite, so a CI run against it would prove nothing.
        # If this workflow ever writes anything the app reads, both come back.
        run: |
          node scripts/moment-watch.mjs --mode=push --commit-seen > /dev/null
          if git diff --quiet -- data/candidates-seen.json; then
            echo "seen-set unchanged"
            exit 0
          fi
          git config user.name  "oravan-sync"
          git config user.email "223600121+cm2489@users.noreply.github.com"
          git add data/candidates-seen.json
          git commit -m "chore(data): moment candidates seen-set $(date -u +%Y-%m-%d)"
          # A stopped rebase is NOT retryable: the `&&` chain used to swallow
          # the conflict and every later iteration then failed identically on
          # "rebase in progress" until the attempts ran out - the shape that
          # cost run 31194836148 its whole night in sync-bills.yml. Fail on the
          # spot instead, naming the file. There is nothing auto-resolvable
          # here: this job writes only data/candidates-seen.json, never
          # data/sync-state.json, so it has no flat key-value state for
          # scripts/merge-sync-state.mjs to union (see sync-bills.yml).
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              if git push; then exit 0; fi
              echo "push race, retrying ($i)"
              continue
            fi
            conflicted="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            git rebase --abort || true
            echo "::error::rebase conflict in: ${conflicted:-<unknown>} - a human must resolve it. The seen-set this run collected is NOT committed."
            exit 1
          done
          exit 1
