name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Dispatched by the five data workflows after their bot pushes: a push made
  # with GITHUB_TOKEN never fires `on: push`, so before this existed main's
  # own CI never tested a freshly-synced corpus. The drift then surfaced on
  # whatever innocent PR ran next (2026-07-25: call-action.spec vs the new
  # floor_vote coverage leader — a full day of red across five open PRs).
  workflow_dispatch:

# A newer push to the same PR cancels its still-running CI: only the latest
# commit — the one the merge gate actually checks — needs to finish, so runs on
# superseded commits stop instead of burning minutes to completion. Scoped to
# PRs only: cancel-in-progress is false for pushes to main, so every post-merge
# run (the production safety net, incl. the nightly data-sync commits) always
# runs to completion and is never interrupted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


# The pull-request check is the job named `test` at the bottom. It does no
# work of its own: it passes only when every job it names passed (or, on a
# docs-only pull request, when the build-and-browser jobs were skipped as
# they should be). The work runs in parallel so the check finishes in about
# half the time it took as one job: the gates, the unit specs (once, with no
# server), and one build that six browser-test shards all serve.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.paths.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect docs-only PR diff (founder-approved fast path, 2026-07-07)
        # PRs whose entire diff is docs/** or *.md skip the E2E build below.
        # Conservative on purpose: any other path (code, messages, configs,
        # this workflow itself) runs the full pipeline, and every push to
        # main still runs the full suite regardless — the fast path only
        # shortens PR iteration, never the post-merge safety net.
        id: paths
        run: |
          DOCS_ONLY=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.event.pull_request.base.sha }}"
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
            echo "$CHANGED"
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qvE '^docs/|\.md$'; then
              DOCS_ONLY=true
            fi
          fi
          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "docs_only=$DOCS_ONLY"
      - uses: actions/setup-node@v6
        if: steps.paths.outputs.docs_only == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.paths.outputs.docs_only == 'true'
      - name: Constitution consistency (the one spec the docs-only fast path used to skip)
        # THE GAP THIS CLOSES: tests/claim-truth.spec.ts is the only thing that
        # polices edits to README/CLAUDE/PRODUCT and docs/constitution-log.md —
        # that the three documents name the SAME three publish gates, that no
        # retired human-review claim comes back, that README principle 5 keeps
        # its review clause scoped to the call script, and that every gate
        # CLAUDE.md names exists. (DESIGN.md was the fourth document until its
        # retirement on 2026-09-27.) It lived in the Playwright job, which the
        # docs-only fast path skips. So the exact change class those tests
        # police — a markdown-only edit to the constitution — was the one class
        # that never gated. Re-adding "human-reviewed" to principle 5 in a
        # docs-only PR would have shipped green.
        #
        # Cheap because it is honest about what it needs: this spec is pure
        # Node (readFileSync + spawnSync), takes no `page` fixture, and so
        # launches no browser. PW_NO_WEBSERVER skips the `next build && next
        # start` the config otherwise stands up; one project instead of two
        # stops it running twice for no reason. Measured locally with
        # PLAYWRIGHT_BROWSERS_PATH pointed at an empty directory — proving the
        # browser-install step above it can stay skipped — at 10 tests in ~10s
        # on a loaded machine.
        if: steps.paths.outputs.docs_only == 'true'
        env:
          PW_NO_WEBSERVER: '1'
        run: npx playwright test tests/claim-truth.spec.ts --project=webkit-desktop

  gates:
    # Every corpus and source gate, typecheck and lint. No `needs`: it runs
    # on every pull request (docs-only ones too) and on every push to main,
    # and `test` cannot pass unless it did.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Vacancy-diff unit tests (departed-member / vacant-no-successor / anomalous-shrink)
        # Stdlib-only (unittest) - no pip install needed, ubuntu-latest ships python3.
        run: cd scripts && python3 -m unittest test_vacancy_diff -v
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: EN/ES message parity — keys AND ICU arguments (bilingual hard rule)
        # Self-test first, same convention as the naming/claim-truth/namespace
        # gates below: the ICU half is a hand-written tokenizer, and a
        # tokenizer that has quietly stopped parsing finds nothing and passes.
        run: |
          node scripts/check-messages-parity.mjs --self-test
          node scripts/check-messages-parity.mjs
      - name: Zero-survivor naming gate (retired names; self-tests before scanning)
        # Exemptions are founder-decided in writing only — docs/migration/decisions.md.
        run: node scripts/check-naming.mjs
      - name: Publication-provenance claims are true (self-tests before scanning)
        # Root cause this exists to prevent: CLAUDE.md's 2026-07-25 amendment
        # retired "human-reviewed before publish" (the nightly decode path has
        # no human step) and was applied to four strings while four more kept
        # shipping the false claim until 2026-08-06 — because NO TEST PINNED ANY
        # OF THEM and nobody had enumerated which surfaces make a publication
        # claim at all. R1 is that enumeration; a phrase denylist alone would
        # miss a reworded false claim.
        run: |
          node scripts/check-claim-truth.mjs --self-test
          node scripts/check-claim-truth.mjs
      - name: public/ ships only allowlisted files
        run: node scripts/check-public-allowlist.mjs
      - name: MCP registry server.json validates (S12; self-tests before scanning)
        run: |
          node scripts/check-server-json.mjs --self-test
          node scripts/check-server-json.mjs
      - name: Upstash key-namespace privacy gate (counters never see content, cache never sees callers, embed-domain sees neither)
        # Self-test first: the gate must prove it still catches its seeded
        # violations before its "clean" verdict on the tree means anything.
        run: |
          node scripts/check-key-namespaces.mjs --self-test
          node scripts/check-key-namespaces.mjs
      - name: Embed no-fingerprinting/no-analytics static gate
        # Same self-test-first convention as the key-namespace gate above.
        run: |
          node scripts/check-embed-fingerprinting.mjs --self-test
          node scripts/check-embed-fingerprinting.mjs
      - name: Client-import gate (no 'use client' module may reach data/)
        # The pre-build half of the client-bundle rule (2026-09-27 audit,
        # card a6): one pure function imported from a corpus-reading module
        # put all of data/ into a 23 MB client chunk. Runs before the build so
        # it names the import chain in seconds; the post-build half below
        # checks what actually shipped. Same self-test-first convention.
        run: |
          node scripts/check-client-imports.mjs --self-test
          node scripts/check-client-imports.mjs
      - name: Resolve origin/main (the Moments new-vehicle baseline)
        # actions/checkout lands a PR at depth 1 with no origin/main ref, so
        # the new-vehicle terminality rule's baseline (check-moments.mjs's
        # `git show origin/main:data/moments.json`) had nothing to resolve
        # against and depended entirely on the gate's own in-gate fallback
        # fetch — a rule enforced only by a network call nobody tested. This
        # step creates the remote-tracking ref up front, so the gate takes its
        # free offline path and `--require-baseline` below can be a HARD
        # failure rather than the warning it used to fall back to.
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Moments curation gate (schema, EN/ES parity, vocabulary lint, live cap, new-vehicle terminality)
        # Was only running transitively via tests/moments.unit.spec.ts in the
        # Playwright job — wiring it here fails fast on a bad data/moments.json
        # before the e2e suite spends its minutes (v2 spec slice S1).
        #
        # --require-baseline: in CI an unresolvable baseline is an ERROR, not
        # the local warning. Without it, the one rule that needs main to exist
        # would go quiet exactly where it is the merge gate — a skipped rule
        # and a passed rule printed the same green check.
        run: node scripts/check-moments.mjs --require-baseline
      - name: Moment-updates gate (the editorial law — record anchoring, speculation lint, attribution, caps)
        # The v2 live layer's write-time constitution (v2 spec §2): every
        # non-press update ships the government's verbatim text, record
        # classes may not hedge, press clusters must name an outlet, EN/ES
        # parity, no future dates, ids that hash to their own content. Runs
        # right after the curation gate so a bad data/moment-updates.json
        # fails before the e2e suite spends its minutes; exits 0 when the
        # file doesn't exist yet (slice S3 is what first writes it).
        run: node scripts/check-moment-updates.mjs
      - name: Floor-signals gate (every T0 announcement carries a dated, attributed, English-verbatim quote)
        # data/floor-signals.json is the only file whose contents get QUOTED
        # to a reader as Congress's own forward-looking words, and it is
        # written HOURLY by newsdesk.yml — which commits to main and then
        # dispatches this workflow against the pushed data. So the gate lives
        # here as well as in the nightly verify-sync.mjs: without it a signal
        # with no quote, no source URL or a translated quote (owner ruling V4)
        # would sit on the site until the small hours. Exits 0 when the file
        # doesn't exist yet.
        run: |
          node scripts/check-floor-signals.mjs --self-test
          node scripts/check-floor-signals.mjs
      - name: Conversation gate (only AllSides-rated outlets may corroborate)
        # data/conversation.json is what the news band's counted captions are
        # made of, and it is written HOURLY by the same newsdesk workflow that
        # commits to main and dispatches this run. The rule it protects is
        # critic B-3: an outlet with no AllSides lean in data/media-bias.json
        # corroborates nothing, because an unrated domain is the channel two
        # press-release pickups would walk through — the single-outlet
        # prioritization channel this repo already closed once on the trigger
        # path. Exits 0 when the file doesn't exist yet.
        run: |
          node scripts/check-conversation.mjs --self-test
          node scripts/check-conversation.mjs
      - name: Question-press gate (per-question GDELT evidence — rated outlets only, every count a stored link, never tone or text)
        # data/question-press.json is written by scripts/gdelt-intake.mjs in
        # its own twice-daily workflow (question-press.yml), which commits to
        # main and dispatches this run. Nothing on the site reads it yet; the gate keeps
        # it honest before anything does: only AllSides-rated outlets, every
        # count derived from stored links on the outlet's own domain, inside
        # the 7-day window, no key the format does not define (no tone, no
        # sentiment, no titles), and the GDELT citation + link its terms
        # require. Only damage in the file itself fails. Drift caused by a
        # change to data/moments.json or data/media-bias.json (a deleted
        # question, an outlet no longer rated or re-rated) only warns, and
        # the collector's next run repairs it. Exits 0 when the file doesn't
        # exist yet.
        run: |
          node scripts/check-question-press.mjs --self-test
          node scripts/check-question-press.mjs
      - name: Roll-call votes gate (every position resolves to a member, totals match, bills exist)
        # data/votes.json is written by the nightly and joined against
        # data/legislators.json, which refresh-legislators.yml rewrites on its
        # own weekly schedule and then dispatches this workflow against. Run
        # the gate here too, so a legislators refresh that broke the join
        # reddens main instead of waiting for the next nightly. Exits 0 when
        # the file doesn't exist yet.
        run: |
          node scripts/check-votes.mjs --self-test
          node scripts/check-votes.mjs
      - name: Senate-nomination data gate (identity, status mapping, calendar numbers, civilian-only)
        # Structural checks are HARD here: they test our own code against the
        # data it produced (slug identity, stored status == what the mapper
        # derives, the terminal-set drift pin), so they can only break if a
        # change in this repo broke them.
        #
        # The one soft check is the sweep for action text no rule classifies,
        # which prints ::warning:: here and fails only under --strict in the
        # nightly sync step. That split IS owner ruling 2026-08-04 (the
        # journey-corpus sweep): a novel Senate sentence landed by the sync
        # must not red the CI of unrelated PRs, and an unclassified record is
        # honest anyway — it renders neutral, claim-free copy.
        run: node scripts/check-nominations.mjs
      - run: npm run typecheck
      - run: npm run lint

  unit:
    # The *.unit.spec.ts files, once. They are pure Node, so no browser and
    # no server (PW_NO_WEBSERVER); playwright.config.ts's `unit` project is
    # the only one that picks them up.
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve origin/main (the baseline some unit specs read)
        # The same depth-1 fetch the gates job makes before the Moments gate.
        # Unit specs such as tests/moments-baseline.unit.spec.ts run that
        # gate themselves and expect it to resolve origin/main offline. When
        # these specs shared one job with the gates, that job's fetch gave it
        # to them; without it the gate falls back to its own fetch and the
        # spec that checks the answer flakes (seen on this job's first runs).
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - name: Unit specs (no server, no browser)
        env:
          PW_NO_WEBSERVER: '1'
        run: npx playwright test --project=unit
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-unit
          path: test-results/
          retention-days: 7

  build:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Cache Next.js build cache
        # Next content-validates .next/cache against each input file's hash, so a
        # stale restore only ever forces a rebuild — it can never yield a wrong
        # build or a page that doesn't reflect current source. Keyed per-commit
        # (always saves a fresh entry) with a lockfile-scoped restore-key so a
        # new commit still starts from the most recent warm cache.
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build the app once (the build every E2E shard serves)
        # tests/e2e-server.mjs with E2E_SERVER_MODE=build: the same
        # `npm run build`, under the same fake-tenancy environment, that the
        # Playwright webServer used to run before its tests.
        env:
          E2E_SERVER_MODE: build
        run: npx tsx tests/e2e-server.mjs
      - name: Client bundle gate (no data/ text in client JS, no chunk over 300 KB)
        # Reads the .next/static/chunks the step above just built, so it
        # costs no second build. !cancelled() so that when the build itself
        # failed this step still runs and says there are no chunks, instead
        # of passing by not running.
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-client-bundle.mjs --self-test
          node scripts/check-client-bundle.mjs
      - name: Pack the build for the shards
        # .next/cache is left out (the cache step above carries it between
        # runs); so are trace files. The shards need only what `next start`
        # serves.
        run: |
          echo "BUILD_ID=$(cat .next/BUILD_ID)"
          tar --zstd -cf next-build.tar.zst --exclude=.next/cache --exclude=.next/dev --exclude='.next/trace*' .next
          ls -l next-build.tar.zst
      - name: Upload the build
        # An artifact, not a cache: it belongs to this run, so every shard
        # gets this commit's build or fails loudly. Uploaded as the tar file
        # itself (archive: false), since zstd has already compressed it.
        uses: actions/upload-artifact@v7
        with:
          path: next-build.tar.zst
          archive: false
          retention-days: 1

  e2e:
    name: e2e ${{ matrix.shard }}/6
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version (browser-cache key)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright WebKit browser
        # Version-keyed, so a cache hit is ALWAYS the browser this Playwright
        # build expects — no mismatch risk. A miss just re-downloads (slower,
        # never wrong). The install step below still runs, so --with-deps system
        # libraries are always installed fresh; only the binary download is saved.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: next-build.tar.zst
      - name: Unpack the build
        run: |
          tar --zstd -xf next-build.tar.zst
          rm next-build.tar.zst
          echo "BUILD_ID=$(cat .next/BUILD_ID)"
      - name: E2E shard (serves the one build, never builds)
        # E2E_SERVER_MODE=start: tests/e2e-server.mjs refuses at once if
        # .next holds no finished build, so a shard can only ever test the
        # build the job above made.
        env:
          E2E_SERVER_MODE: start
        run: npx playwright test --project=webkit-mobile --project=webkit-desktop --project=webkit-320 --shard=${{ matrix.shard }}/6 --reporter=github,blob
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-e2e-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-e2e-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  e2e-report:
    # Information only: one HTML report stitched from the six shards. `test`
    # does not wait for it.
    needs: [build, e2e]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-e2e-*
          path: all-blob-reports
          merge-multiple: true
      - name: Merge the shard reports
        run: npx playwright merge-reports --reporter=html ./all-blob-reports
      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  test:
    # The one check to read, and the one a required status check on main
    # would name. `if: always()`
    # because a check that is skipped counts as passing: this job must run
    # and fail whenever anything it depends on failed, was cancelled, or was
    # skipped when it should have run.
    needs: [changes, gates, unit, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          result() { echo "$NEEDS" | jq -r --arg j "$1" '.[$j].result'; }
          DOCS_ONLY=$(echo "$NEEDS" | jq -r '.changes.outputs.docs_only')
          echo "docs_only=$DOCS_ONLY"
          FAIL=0
          expect() {
            GOT=$(result "$1")
            if [ "$GOT" = "$2" ]; then
              echo "ok: $1 is $GOT"
            else
              echo "::error::$1 is $GOT, expected $2"
              FAIL=1
            fi
          }
          expect changes success
          expect gates success
          if [ "$DOCS_ONLY" = "true" ]; then
            expect unit skipped
            expect build skipped
            expect e2e skipped
          else
            expect unit success
            expect build success
            expect e2e success
          fi
          exit $FAIL
