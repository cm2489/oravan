name: Hot-bill refresh

# Twice-daily, refresh-ONLY pass between nightly bill syncs (audit §4 Alt B /
# §5 item 3, pipeline-audit.md): the nightly sync (sync-bills.yml, 14:15 UTC
# since 2026-08-12; 07:30 UTC when this job was written) structurally can't
# reflect a floor vote or markup that happens after it runs until the
# following day. This job re-fetches the ~100 most-recently-updated
# Congress.gov bills and refreshes status/last_action_date/urgency for
# whichever of them are ALREADY in the corpus - decodes nothing, so a
# brand-new bill still waits for the nightly sync's decode-before-publish
# gate (scripts/hot-bills.mjs's header comment has the full reasoning).
# Zero Anthropic usage: no ANTHROPIC_API_KEY in this workflow at all.

on:
  schedule:
    # 13:47 and 22:47 UTC. Re-phased 2026-08-08 from '0 17'/'0 22'; the
    # reasoning, so a future reader can re-derive it without re-measuring:
    #
    # 1. WHEN THE RECORD PUBLISHES. Congress.gov publishes day D's floor
    #    actions on D+1 between 13:35 and 14:00 UTC. Measured over 6/6
    #    consecutive legislative days from senate.gov's per-day floor XML
    #    `Last-Modified` headers: 13:35:27 through 13:55:29, no day outside
    #    that band. This repo's own corpus history agrees independently:
    #    commits at 08:30-10:10 UTC carry no trace of the previous day's
    #    floor actions; commits at 12:15-17:42 do. The old 17:00 slot ran
    #    three hours after the record was already sitting there.
    # 2. CRON DRIFT IS ONE-DIRECTIONAL. GitHub's scheduler on this repo has
    #    drifted from +17 min to +3h27m (the old '0 22' once fired at 01:27
    #    UTC) and is worst at the top of the hour - but it NEVER fires
    #    early. So the earliest safe minute is the first one at or after the
    #    latest observed publication plus margin: 13:47. Under typical drift
    #    the job lands 14:04-14:30 UTC (~09:04-09:30 ET); under the worst
    #    observed drift it still lands the same day, just later.
    # 3. OFF-HOUR, OFF-:00/:30 ON PURPOSE. :47 dodges the top-of-hour and
    #    half-hour queues where the scheduler's backlog (and therefore its
    #    drift) is worst.
    # 4. THE SECOND SLOT keeps its original 22:00-hour placement (~6pm ET,
    #    late-session floor and committee activity that posts after the
    #    morning record) and only takes the same :47 minute. 13:47 and
    #    22:47 sit 9 hours apart.
    # 5. THE NIGHTLY SYNC MOVED ONTO THIS SAME MEASUREMENT on 2026-08-12
    #    (owner ruling D8): sync-bills.yml now runs at 14:15 UTC, 28 minutes
    #    after this job's first pass, for exactly the reason in (1). The old
    #    "clear of the nightly sync on both sides" property is therefore
    #    RETIRED by design rather than by accident - the two are adjacent now,
    #    and the shared data-sync concurrency group is what keeps them from
    #    racing each other's commit to data/bills.json. What that group cannot
    #    do is protect a PENDING run: if this pass is still executing when the
    #    nightly queues, the nightly waits, and a waiting run is what newsdesk
    #    evicts (2026-08-08). The residual risk is small (this pass is minutes
    #    long, and both crons drift by hours) and is recorded here rather than
    #    left for someone to rediscover.
    - cron: '47 13 * * *'
    - cron: '47 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # lets the workflow dispatch ci.yml after its own push

concurrency:
  # Shared with sync-bills.yml / newsdesk.yml / moment-watch.yml so this can
  # never race the nightly sync's commit - this workflow and the nightly both
  # write data/bills.json, which is the reason the group exists.
  # refresh-legislators.yml left it on 2026-08-12: its files are disjoint from
  # everything here, so serialising it bought nothing and exposed it to
  # pending-run eviction (see that file's concurrency comment).
  group: data-sync
  cancel-in-progress: false

jobs:
  hot-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        # scripts/hot-bills.mjs and scripts/congress-fetch.mjs are stdlib-only
        # (Node's global fetch + lib/urgency.mjs, a plain .mjs with no npm
        # deps) - same "the runner's node suffices, no npm ci" posture as
        # refresh-legislators.yml and scripts/verify-deploy.mjs.
        with:
          node-version: 24
      - name: Refresh hot bills
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node scripts/hot-bills.mjs
      - name: Commit data
        id: commit
        # Same oravan-sync author pattern as sync-bills.yml/refresh-
        # legislators.yml - the author email must map to the Vercel-linked
        # GitHub account or Vercel BLOCKs the auto-deploy (docs/solutions/
        # vercel-bot-push-blocked-deploys.md).
        run: |
          git config user.name "oravan-sync"
          git config user.email "223600121+cm2489@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(data): hot-bill refresh $(date -u +%FT%HZ)"
          # This job only ever touches data/bills.json (refresh-only, no ES/
          # coverage/sync-state writes) - disjoint from sync-bills.yml's and
          # refresh-legislators.yml's own file sets, but the checked-out base
          # can still go stale behind either of them in the shared data-sync
          # concurrency group. Rebase onto the latest main and retry, same
          # pattern as the other two workflows.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $i)"
            # Guarded: a bare `git fetch` under `bash -e` kills the step on the
            # spot, which would make these five attempts as decorative as
            # sync-bills.yml's were on 2026-08-07.
            if ! git fetch origin main; then
              echo "fetch failed (attempt $i) - retrying"
              continue
            fi
            if git rebase origin/main; then
              continue
            fi
            # A stopped rebase is NOT retryable: every later iteration fails
            # identically until the attempts run out, which is how run
            # 31194836148 burned all five in sync-bills.yml and left a
            # misleading "push rejected" as its last word. Fail here instead,
            # naming the files. Nothing is auto-resolvable in this job - it
            # never writes data/sync-state.json, the one flat key-value file
            # with a deterministic union (scripts/merge-sync-state.mjs, wired
            # into sync-bills.yml only).
            conflicted="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            git rebase --abort || true
            echo "::error::rebase conflict in: ${conflicted:-<unknown>} - a human must resolve it. The hot-bill refresh this run collected is NOT committed."
            exit 1
          done
          exit 1
      - name: Verify the deploy landed
        # Same dead-man's-switch as sync-bills.yml/refresh-legislators.yml -
        # poll production until it serves the SHA we just pushed. A missing
        # PROD_URL repo variable FAILS this step rather than skipping it
        # (2026-08-12) - see scripts/verify-deploy.mjs's header.
        if: steps.commit.outputs.changed == 'true'
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          EXPECT_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/verify-deploy.mjs
      - name: Dispatch CI against the pushed data
        # Bot pushes (GITHUB_TOKEN) never trigger `on: push`, so without this
        # main's own suite never runs against a fresh corpus and test/corpus
        # drift lands on the next open PR instead (2026-07-25 incident).
        # Free on a public repo; the ci-refs/heads/main concurrency group
        # queues rather than cancels, so runs serialize harmlessly.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
