name: Nightly bill sync

on:
  schedule:
    - cron: '30 7 * * *' # 07:30 UTC = 3:30am ET, after Congress.gov's own update cycle
  workflow_dispatch:
    inputs:
      max_new_decodes:
        description: 'Max new bills to AI-decode this run (safety ceiling — the priority gate does the real limiting)'
        default: '60'
      force_decode_slugs:
        description: 'Comma-separated slugs to bypass the priority gate for (e.g. hr-1234-119,s-45-119)'
        default: ''
      coverage_top_n:
        # The one-time wide refresh lever (owner directive, 2026-08-05). Leave
        # blank for the nightly default of 600.
        #
        # SIZING IT: TheNewsAPI Basic allows 2,500 requests/day and the run
        # spends one per bill, so 2400 is the largest value that fits a single
        # day with headroom — it does NOT cover the full ~2,507-bill eligible
        # set in one pass. That is fine and deliberate: one wide run plus the
        # 50/50 least-recently-checked rotation reaches the whole corpus within
        # a couple of nights, and the run commits what it has if quota is hit.
        description: 'One-off COVERAGE_TOP_N override (blank = 600 nightly; 2400 = widest single-day refresh on the Basic tier)'
        default: ''
      coverage_tail_share:
        description: 'One-off COVERAGE_TAIL_SHARE override (blank = 0.5; set 0 for pure urgency order)'
        default: ''

permissions:
  contents: write
  actions: write  # lets the workflow dispatch ci.yml after its own push

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Mark run start
        # Consumed by the post-sync verifier: sync-state.json's lastRun must
        # advance past this timestamp or the night's run didn't do its job.
        id: runstart
        run: echo "ts=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - name: Sync bills
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_NEW_DECODES: ${{ inputs.max_new_decodes || '60' }}
          FORCE_DECODE_SLUGS: ${{ inputs.force_decode_slugs || '' }}
        run: node scripts/sync-bills.mjs
      - name: Journey-corpus tripwire (unclassified floor texts fail the sync, not PRs)
        # Owner ruling 2026-08-04: the sweep fires where the data changes.
        # A novel floor-action shape fails THIS run loudly (extend
        # floorActionChamber); the site renders neutral no-chamber copy for
        # that bill in the meantime — never a guessed chamber.
        run: node scripts/check-journey-corpus.mjs
      - name: Sync Senate nominations
        # A SEPARATE script and a SEPARATE step, on the sync-coverage.mjs
        # precedent: the bill corpus is the product's spine, and a
        # nomination-side outage (a Congress.gov field change, a rate limit,
        # a novel record shape) must never be able to cost a night of bill
        # statuses. continue-on-error for the same reason the Moment-updates
        # step below has it — this data is additive.
        #
        # Cost: ONE free Congress.gov request on a normal night (95
        # nominations changed on the busiest measured day, 2026-08-06;
        # limit=250 covers it). No Anthropic key, no AI, no spend. The
        # one-time backfill (9 requests) already ran and is committed, so
        # this runs the incremental cursor path from day one.
        #
        # THE STRUCTURAL GATE IS INSIDE THIS STEP (2026-08-09), not the one
        # below. scripts/sync-nominations.mjs runs check-nominations.mjs's
        # hard checks over the corpus it has just built and refuses to WRITE a
        # failing one — see that script's pre-write gate. It had to move there
        # because of the `continue-on-error` on this very step: every verdict
        # reached after the corpus is on disk is advisory by construction, so
        # a structurally corrupt nominations.json was committed and deployed
        # no matter what the step below said about it. A corpus that never
        # reaches disk cannot be committed by the commit step, so the bill
        # sync still keeps its night and nothing corrupt can ship.
        continue-on-error: true
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: node scripts/sync-nominations.mjs
      - name: Nomination-corpus tripwire (unclassified action text fails the sync, not PRs)
        # SCOPE: this step is the UNCLASSIFIED SWEEP and nothing else. The
        # structural checks are hard, and they already ran with the power to
        # stop the write, inside the sync step above; by the time this runs
        # the corpus on disk has necessarily passed them.
        #
        # --strict turns the unclassified sweep from a warning into a
        # failure. Owner ruling 2026-08-04, same shape as the journey-corpus
        # step above: the sweep fires where the data changes. A novel Senate
        # sentence fails THIS run loudly (extend mapNominationStatus in
        # lib/nomination-status.mjs); the record meanwhile carries the
        # honest `unclassified` status and renders neutral, chamber-free
        # copy — never a guessed one.
        #
        # continue-on-error so the verdict is recorded and visible without
        # costing the bill sync its night. That does mean an unclassified
        # record still gets committed by the step below, which is correct:
        # `unclassified` is an honest state, and a stale corpus would be a
        # worse trade than a record that declines to make a claim. That
        # trade-off is the ONLY thing this step's continue-on-error now
        # excuses — which is what its comment always claimed, and what was
        # untrue while the same flag was also making every structural check
        # advisory.
        continue-on-error: true
        run: node scripts/check-nominations.mjs --strict
      - name: Backfill coverage search inputs
        # Drains press_names/news_query for bills decoded before search-input
        # generation existed (~1,090 at introduction; 835 left after night one,
        # ≈2 nights at this budget), then becomes a fast no-op sweeping decode-time
        # misses. Runs BEFORE the coverage sync so tonight's queries benefit.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKFILL_LIMIT: 450
        run: node scripts/backfill-search-inputs.mjs
      - name: Sync coverage
        # No-op unless NEWS_API_KEY is set, so this is safe before the secret exists.
        #
        # The two COVERAGE_* vars are blank on every scheduled run, so the
        # script's own defaults apply (600 bills, 50/50 urgency/least-recently-
        # checked). They exist for the manual wide-refresh dispatch — see the
        # workflow_dispatch inputs above. An empty env var is treated as unset
        # by the script's `?? default` reads only because we omit it entirely
        # when blank, which the `|| ''` fallback below preserves.
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.coverage_top_n }}" ]; then
            export COVERAGE_TOP_N="${{ inputs.coverage_top_n }}"
          fi
          if [ -n "${{ inputs.coverage_tail_share }}" ]; then
            export COVERAGE_TAIL_SHARE="${{ inputs.coverage_tail_share }}"
          fi
          node scripts/sync-coverage.mjs
      - name: Collect Moment updates (Moments v2 live layer, nightly)
        # Nightly mode = the incremental pass PLUS press clusters, retention
        # pruning, and the "Where it stands" state summaries. Runs AFTER the
        # coverage sync (so tonight's clusters see tonight's articles) and
        # BEFORE verify-sync.mjs (so the night's dead-man's-switch inspects
        # what this step actually wrote). continue-on-error for the same
        # reason as in newsdesk.yml: the live layer is additive and must never
        # cost the nightly run its corpus work.
        # Cost: ONE batched Haiku call + at most MOMENT_SUMMARY_DAILY_CAP=8
        # Sonnet 5 summaries, and only for moments that actually moved — see
        # scripts/moment-updates.mjs's SPEND section.
        continue-on-error: true
        env:
          MOMENT_UPDATES_MODE: nightly
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/moment-updates.mjs
      - name: Mirror embed portraits to Vercel Blob
        # No-op unless BLOB_READ_WRITE_TOKEN is set, so this is safe before
        # the store/secret exist - same pattern as "Sync coverage" above.
        # See scripts/mirror-portraits.mjs and the S15 PR's Owner enable
        # checklist. Runs here (not in refresh-legislators.yml, which is
        # deliberately stdlib-only/no `npm ci`) because this job already
        # installs node_modules for @vercel/blob to resolve.
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/mirror-portraits.mjs
      - name: Verify the sync did its job (dead-man's-switch)
        # Fails loudly BEFORE anything is committed: corpus parses, EN/ES
        # parity holds, the bill count didn't drop, and sync-state advanced
        # tonight. Warns (never fails) on corpus staleness while the decode
        # backlog drains. See scripts/verify-sync.mjs and docs/solutions/.
        env:
          RUN_STARTED_AT: ${{ steps.runstart.outputs.ts }}
        run: node scripts/verify-sync.mjs
      - name: Verify rate-limit salt age (dead-man's-switch)
        # Loud failure if the counters database's hashing salt outlived its
        # 24h TTL, lost its TTL, or got corrupted - silent rotation failure
        # would turn short-lived rate-limit counters into stable identifiers
        # (S11/F5). Skips with a ::warning until the two counter secrets are
        # added to Actions; see scripts/verify-salt.mjs.
        env:
          UPSTASH_COUNTERS_REST_URL: ${{ secrets.UPSTASH_COUNTERS_REST_URL }}
          UPSTASH_COUNTERS_REST_TOKEN: ${{ secrets.UPSTASH_COUNTERS_REST_TOKEN }}
        run: node scripts/verify-salt.mjs
      - name: Commit data
        id: commit
        # The author email must map to the Vercel-linked GitHub account
        # (cm2489): Vercel BLOCKs auto-deploys for commits from unlinked
        # authors, and — proven by the 2026-07-02 nightly run — deploy hooks
        # do NOT bypass that check; the hook's deployment of the same commit
        # was BLOCKED identically. Authoring as the linked account lets the
        # normal git-integration deploy proceed.
        # See docs/solutions/vercel-bot-push-blocked-deploys.md.
        run: |
          git config user.name "oravan-sync"
          git config user.email "223600121+cm2489@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "chore(data): nightly bill sync $(date -u +%F)"

          # Everything above this line has already been PAID FOR. Nothing below
          # may throw it away quietly. See `abandon` and the salvage step.
          abandon() {
            trap - EXIT   # never re-enter through the trap below
            local sha
            sha="$(git rev-parse HEAD)"
            echo "::error::THE SYNC ITSELF SUCCEEDED - only the commit failed. $1"
            echo "::error::Discarded commit ${sha}: a full night of bills, coverage (PAID TheNewsAPI requests, one per bill - a wide run is ~2,400 and exhausts the daily quota), nominations, Moment updates and portraits. Re-running does NOT get the quota back."
            echo "::error::The commit is preserved verbatim as the 'discarded-sync-${GITHUB_RUN_ID}' artifact on this run. Recover with: gh run download ${GITHUB_RUN_ID} -n discarded-sync-${GITHUB_RUN_ID} && git fetch ./discarded-commit.bundle main:salvaged && git cherry-pick salvaged"
            echo "--- what was in the discarded commit ---"
            git show --stat --oneline "${sha}" | head -20
            mkdir -p salvage
            git bundle create salvage/discarded-commit.bundle main --not origin/main || \
              echo "::warning::could not bundle the discarded commit; the data is lost with this runner"
            git show --stat --oneline "${sha}" > salvage/discarded-commit.txt || true
            exit 1
          }

          # THE RETRIES WERE NEVER THE BACKSTOP THEY LOOKED LIKE. This step runs
          # under `bash -e`, so on 2026-08-07 the failing `git rebase` ended the
          # script on attempt 1 - the `for i in 1 2 3 4 5` loop read as resilient
          # and was decorative, which is worse than no loop at all, because it
          # stopped anyone from asking whether the retry actually worked.
          # So, belt and braces: every git call in the loop below is guarded
          # (`if`/`|| true`) so the loop genuinely gets its five attempts, AND
          # this trap catches anything unguarded that still manages to kill the
          # step - the night's paid work gets salvaged instead of vanishing with
          # the runner. No backticks in the message: a trap string is re-parsed
          # as a command when it fires, so a backtick would run as a subshell.
          trap 'rc=$?; [ "$rc" -eq 0 ] || abandon "the step exited unexpectedly with status ${rc} - a git command failed under bash -e. This is a BUG in the commit step, not a data problem."' EXIT

          # The scheduled run's checked-out base can be stale by the time this
          # job starts (queued behind refresh-legislators.yml in the shared
          # data-sync concurrency group, whose push lands after our SHA was
          # resolved - the 2026-06-22 failure, there in the other workflow).
          # Rebase onto the latest main and retry; safe because this workflow
          # only touches bills.json/bills-es.json/sync-state.json/
          # coverage.json/portrait-manifest.json/moment-updates.json/
          # nominations.json, disjoint from refresh-legislators.yml's files.
          # `git add data/` stages all of them, including whatever the
          # Moment-updates and nomination steps wrote.
          #
          # That reasoning covered a racing DATA WORKFLOW only - a
          # fast-forward problem. It did NOT survive a CONTENT conflict, and
          # on 2026-08-07 (run 31194836148) one arrived: PR #166 merged
          # mid-run and added `nominationsLastSync` to data/sync-state.json
          # while this run's own commit rewrote lastSync/lastRun in the same
          # file. `git rebase` stopped mid-rebase - and note that the retry
          # loop never even got its five attempts: this step runs under
          # `bash -e`, so the failing `git rebase` killed the script on
          # attempt 1. Either way a 2,400-bill coverage pass (339 bills, 661
          # articles, the day's whole TheNewsAPI quota, ending in a 429 storm)
          # was thrown away.
          #
          # Now that feature branches touch that file at all, any long sync
          # overlapping any such merge fails that way. So: a conflict CONFINED
          # to data/sync-state.json is resolved by union
          # (scripts/merge-sync-state.mjs - flat file, independent keys,
          # newest timestamp wins per key) and the rebase continues. A
          # conflict in ANY other file still fails loudly and immediately -
          # bills.json and coverage.json are corpora, not key-value state, and
          # nothing here is allowed to guess at one.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, rebasing onto latest main (attempt $i)"
            if ! git fetch origin main; then
              echo "fetch failed (attempt $i) - retrying"
              continue
            fi
            if git rebase origin/main; then
              continue
            fi

            conflicted="$(git diff --name-only --diff-filter=U | sort | tr '\n' ' ' | sed 's/ $//')"
            echo "rebase stopped on a conflict in: ${conflicted:-<unknown>}"
            if [ "$conflicted" != "data/sync-state.json" ]; then
              git rebase --abort || true
              abandon "rebase hit a conflict this workflow must NOT resolve automatically, in: ${conflicted:-<unknown>}. Only data/sync-state.json is a flat key-value file with a deterministic union; every other data/ file is a corpus and needs a human."
            fi

            if ! node scripts/merge-sync-state.mjs; then
              git rebase --abort || true
              abandon "data/sync-state.json conflicted in a way that has no deterministic union (see the merge-sync-state error above)."
            fi
            if ! git add data/sync-state.json; then
              git rebase --abort || true
              abandon "could not stage the resolved data/sync-state.json."
            fi

            # If the union left the replayed commit with nothing new in it,
            # `git rebase --continue` refuses ("nothing to commit"); skipping
            # is then correct and loses nothing, because the index already
            # matches HEAD.
            if git diff --cached --quiet; then
              echo "the resolved commit is empty against the new main - skipping it"
              if ! GIT_EDITOR=true git rebase --skip; then
                git rebase --abort || true
                abandon "git rebase --skip failed after resolving data/sync-state.json."
              fi
            elif ! GIT_EDITOR=true git rebase --continue; then
              git rebase --abort || true
              abandon "git rebase --continue failed after resolving data/sync-state.json."
            fi
          done
          abandon "all five push attempts failed - either main kept moving under us, or the remote was unreachable. The per-attempt reason is in the log above."
      - name: Package the sync a gate before the commit step threw away
        # The salvage step below only ever fired for a FAILED commit step, and
        # `salvage/` is written by that step's own abandon(). But a gate that
        # fails BEFORE it - the journey/nomination tripwires, the search-input
        # backfill, coverage, portraits, verify-sync, even the salt check,
        # which has nothing to do with bill data at all - SKIPS the commit
        # step, and a skipped step is not a failed one. So abandon() never
        # ran, no bundle was ever written, and the night's paid work (the AI
        # decodes scripts/sync-bills.mjs has already written to data/, plus
        # whatever later steps completed) died with the runner. Widening the
        # upload's `if:` alone would have uploaded an empty directory.
        #
        # This step writes the SAME payload for that path - a local commit,
        # bundled for the upload below. It NEVER pushes; nothing here can put
        # a byte on main.
        #
        # THE BUNDLE IS EVIDENCE, NOT A GREEN LIGHT. A gate failed, so fix
        # what failed before replaying any of it: verify-sync.mjs failing
        # means the corpus itself is suspect, while the salt check failing
        # says nothing about the corpus at all. The judgement stays with a
        # human - this step only refuses to let the runner delete the
        # evidence.
        if: always() && failure() && steps.commit.outcome != 'success' && steps.commit.outcome != 'failure'
        run: |
          if [ -z "$(git status --porcelain -- data/)" ]; then
            echo "::notice::a gate failed before the commit step, but data/ is unchanged - nothing to salvage."
            exit 0
          fi
          # Same linked author as the commit step: a salvaged commit that is
          # later cherry-picked onto main must not be BLOCKED by Vercel for an
          # unlinked author. See docs/solutions/vercel-bot-push-blocked-deploys.md.
          git config user.name "oravan-sync"
          git config user.email "223600121+cm2489@users.noreply.github.com"
          git add data/
          git commit -q -m "chore(data): salvaged nightly sync $(date -u +%F) (a gate failed; never pushed)"
          sha="$(git rev-parse HEAD)"
          echo "::error::A GATE BEFORE THE COMMIT STEP FAILED - the reason is in the failing step above. The night's work itself is NOT gone: it is preserved as the 'discarded-sync-${GITHUB_RUN_ID}' artifact on this run."
          echo "::error::Fix the failing gate FIRST. Then, only if its failure was unrelated to the corpus: gh run download ${GITHUB_RUN_ID} -n discarded-sync-${GITHUB_RUN_ID} && git fetch ./discarded-commit.bundle main:salvaged && git cherry-pick salvaged"
          echo "--- what is in the salvaged commit ---"
          git show --stat --oneline "${sha}" | head -20
          mkdir -p salvage
          git bundle create salvage/discarded-commit.bundle main --not origin/main || \
            echo "::warning::could not bundle the salvaged commit; the data is lost with this runner"
          git show --stat --oneline "${sha}" > salvage/discarded-commit.txt || true
      - name: Salvage the sync the commit step could not land
        # Run 31194836148 did every expensive thing right and then lost all of
        # it at the push, and the failure looked at a glance like "the sync
        # broke". It didn't. When the commit step gives up it now bundles the
        # un-pushed commit here, so the night's paid work (a wide coverage pass
        # is ~2,400 PAID TheNewsAPI requests and the whole daily quota) can be
        # replayed onto main by hand instead of re-bought. Recovery commands
        # are in the step's own ::error:: annotations.
        #
        # TWO paths reach this upload, and for most of the nightly's life only
        # the first existed:
        #   1. the commit step RAN and FAILED - abandon() wrote salvage/;
        #   2. a gate BEFORE the commit step failed, so the commit step was
        #      SKIPPED (outcome 'skipped', never 'failure') and the step above
        #      wrote salvage/ instead. Path 2 was silently uncovered: the
        #      condition tested only for 'failure', so every pre-commit gate
        #      failure took the whole night's paid work down with the runner.
        # The `!= 'success'` half of the condition is deliberately written as
        # "not success" rather than "== 'skipped'" so a cancelled or otherwise
        # unreported commit step still salvages rather than silently not.
        if: always() && (steps.commit.outcome == 'failure' || (failure() && steps.commit.outcome != 'success'))
        uses: actions/upload-artifact@v7
        with:
          name: discarded-sync-${{ github.run_id }}
          path: salvage/
          retention-days: 30
          if-no-files-found: warn
      - name: Verify the deploy landed
        # The push above triggers Vercel's git-integration deploy (the commit
        # author is linked, so it is no longer BLOCKED). Deploys can still fail
        # or be dropped silently (PR #18's root cause hid for weeks behind
        # green checkmarks) - poll production until it serves the SHA we just
        # pushed. Skips with a notice until the PROD_URL repo variable is set.
        if: steps.commit.outputs.changed == 'true'
        env:
          PROD_URL: ${{ vars.PROD_URL }}
          EXPECT_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/verify-deploy.mjs
      - name: Dispatch CI against the pushed data
        # Bot pushes (GITHUB_TOKEN) never trigger `on: push`, so without this
        # main's own suite never runs against a fresh corpus and test/corpus
        # drift lands on the next open PR instead (2026-07-25 incident).
        # Free on a public repo; the ci-refs/heads/main concurrency group
        # queues rather than cancels, so runs serialize harmlessly.
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
      - name: Pre-generate top-band call scripts (S21, F7 - dark until armed)
        # Nightly pregen of the top-10 "Act now" bills' call scripts
        # (strategy §9.1(d)): writes straight into the S11 cache database
        # with build-time secrets, never through /api/script (F7 - a public
        # pregen flag is explicitly ruled out; app/api/script/route.ts stays
        # unaware pregen exists, grep-enforced in CI). Shipped dark: gated on
        # the PREGEN_ENABLED repo variable so this spends $0 until the owner
        # explicitly arms it (see the introducing PR's Arming checklist).
        # Must run via tsx, not plain node - see scripts/pregen-scripts.mjs.
        env:
          PREGEN_ENABLED: ${{ vars.PREGEN_ENABLED }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          UPSTASH_CACHE_REST_URL: ${{ secrets.UPSTASH_CACHE_REST_URL }}
          UPSTASH_CACHE_REST_TOKEN: ${{ secrets.UPSTASH_CACHE_REST_TOKEN }}
          # 2026-07-16 metrics-env fix (same root cause as PR #87's "Flagged,
          # not fixed" note on daily-metrics.yml): this workflow never set
          # VERCEL_ENV either, so lib/scriptcache.ts's keys were written under
          # keyPrefix()'s 'dev' fallback instead of 'production' — every combo
          # this step ever cached since PREGEN_ENABLED was armed (2026-07-12)
          # landed in a keyspace app/api/script/route.ts's live requests
          # (VERCEL_ENV=production, Vercel-injected) never read, so every
          # pregen run has been pure spend with zero possible cache hits.
          VERCEL_ENV: production
        run: |
          if [ "$PREGEN_ENABLED" != "true" ]; then
            echo "::notice::pregen SKIPPED - repo variable PREGEN_ENABLED is not 'true'. \$0 spent tonight. See the S21 PR's Arming checklist to turn this on."
            exit 0
          fi
          npx tsx scripts/pregen-scripts.mjs
