name: Daily metrics digest

# Traffic-watch design (2026-07): a founder-facing daily digest of MCP
# tool-call / /api/script generation VOLUME, sourced entirely from the
# existing counters-database usage family (lib/usage.ts) — no new
# database, no new secret, zero client-side analytics (CLAUDE.md's
# constitution forbids that permanently; see scripts/daily-metrics.mjs's
# header comment and the digest body itself for the disclosure).
#
# Site page views joined the digest 2026-09 (site-counter), from the SAME
# counters database and still with no client script: lib/usage.ts's
# pageview family, one counter per ROUTE TEMPLATE per UTC day, incremented
# server-side in proxy.ts. Vercel Web Analytics remains out: it needs the
# @vercel/analytics client script, which the constitution permanently bans.
# (Corrected 2026-09-18: Vercel's server-side Observability DOES have a
# programmatic route — `vercel metrics --format json`, CLI, public beta 2026,
# requires Observability Plus — and runtime-log aggregation over the API. This
# digest does not read either one; the first-party counter needs no plan tier
# and no new token, which is why it was chosen instead.)
#
# Pipeline health (2026-09) also rides this job: scripts/pipeline-health.mjs
# builds one deterministic report from the Actions run list, the run logs the
# data workflows already print, the committed data files and the open-issue
# list. No new secret, no paid call — which is why this job now also needs
# `actions: read` below.

on:
  schedule:
    # 13:00 UTC, and DELIBERATELY LEFT ALONE by the 2026-08-12 nightly
    # re-phase (owner ruling D8), because the comment that used to sit here
    # asserted a dependency this job does not have. It read "after sync-bills
    # (07:30) and Monday's legislators refresh (08:00)" — but this job reads
    # nothing the sync writes: scripts/daily-metrics.mjs imports lib/usage.ts
    # and lib/traffic-metrics.mjs and reads the counters database over HTTP.
    # It touches no file in data/, so no ordering against any data workflow
    # buys it anything, and it is on its own concurrency group below so it
    # never queues behind one either. The slot stands on its own merit: a
    # UTC-day digest posted early in the US morning.
    - cron: '0 13 * * *' # 13:00 UTC — no data/ dependency; see the note above
  workflow_dispatch:
    inputs:
      secrets_health:
        description: 'Also ping the three Upstash REST databases (status code + 8 hostname chars only — never a token, never a full URL)'
        type: boolean
        default: false

permissions:
  contents: read
  # actions: read is what lets `gh run list` / `gh run view --log` see this
  # repo's own workflow runs — the whole input to the pipeline-health report.
  # Read-only: this job cannot start, cancel or re-run anything.
  actions: read
  issues: write

concurrency:
  group: daily-metrics
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pipeline-health report's corpus/coverage DELTAS compare
          # data/bills.json and data/coverage.json against the commit before
          # the one that last touched them, so the default depth-1 checkout
          # would leave both deltas permanently "not found". 25 is generous
          # against how often the data workflows commit (several times a day,
          # so both files are touched well inside it) and still cheap. A
          # shallow history the walk cannot resolve yields a NULL delta with a
          # warning, never a wrong number.
          fetch-depth: 25
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        # Unlike refresh-legislators.yml's stdlib-only steps, this job needs
        # `tsx` (a real devDependency) to run scripts/daily-metrics.mjs —
        # that script reuses lib/usage.ts's real key-builder/read logic
        # rather than a second, independently-maintained copy of the key
        # format (see that script's own header comment for why plain node
        # can't resolve lib/usage.ts's extensionless imports).
      - name: Ensure labels + pinned digest issue exist (idempotent)
        id: setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create metrics --color 1D76DB --description "Daily metrics digest" --force
          gh label create traffic-spike --color D93F0B --description "Automated traffic-spike alert" --force
          gh label create traffic-decline --color FBCA04 --description "Automated traffic-decline alert (standing issue)" --force
          gh label create pipeline-health --color 0E8A16 --description "Daily pipeline-health report (standing issue)" --force
          NUM=$(gh issue list --repo cm2489/oravan --state open --search 'in:title "Daily metrics"' \
                --json number,title --jq '.[] | select(.title=="📊 Daily metrics") | .number' | head -1)
          if [ -z "$NUM" ]; then
            NUM=$(gh issue create --repo cm2489/oravan --title "📊 Daily metrics" --label metrics \
                  --body "Automated daily digest — one comment per day. Covers MCP tool calls, /api/script generations, and site page views from the counters database's usage family (lib/usage.ts), with a spike check against a trailing 7-day median on the two MCP/script aggregates, plus a Pipeline health section built by scripts/pipeline-health.mjs. Site page views are first-party and server-side (one counter per route template per UTC day, incremented in proxy.ts — no client script, no path, no query, no caller material): they are requests, bots included, not people, and there is no unique-visitor count. Not Vercel Web Analytics — that API needs the @vercel/analytics client script, which CLAUDE.md permanently bans. A vendor server-side source also exists — \`vercel metrics --format json\` (CLI, public beta 2026, requires Observability Plus) — and this digest does not read it. See scripts/daily-metrics.mjs for the full reasoning." \
                  | grep -oE '[0-9]+$')
            gh issue pin --repo cm2489/oravan "$NUM" || true
          fi
          echo "issue_num=$NUM" >> "$GITHUB_OUTPUT"
        # Labels + the pinned issue are created BY THIS WORKFLOW every run,
        # idempotently — a `gh label create --force` is a no-op upsert when
        # the label already exists, and the issue lookup/create is guarded
        # by its own title search. This repo's own house lesson (a
        # workflow-referenced label that doesn't already exist breaks the
        # first real run — refresh-legislators.yml's data-vacancy/
        # redistricting-watch labels were both created out-of-band, not by
        # committed code) is why this step exists at all rather than a
        # separate manual PR-checklist item to forget. Updated 2026-08-12:
        # refresh-legislators.yml now upserts `redistricting-watch` itself,
        # the same way; `data-vacancy` is still the out-of-band one.
      - name: Compute + post digest, file spike / decline issues if tripped
        env:
          UPSTASH_COUNTERS_REST_URL: ${{ secrets.UPSTASH_COUNTERS_REST_URL }}
          UPSTASH_COUNTERS_REST_TOKEN: ${{ secrets.UPSTASH_COUNTERS_REST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST_ISSUE_NUMBER: ${{ steps.setup.outputs.issue_num }}
          # Flagged (not fixed) in PR #87: this workflow never set VERCEL_ENV,
          # so lib/upstash.ts's keyPrefix() resolved to 'dev' here while the
          # live site's routes write under 'production:' (VERCEL_ENV is
          # Vercel-injected at request time, not something a GitHub Actions
          # runner has). Every readUsageWindow/readMcpClientDay call was
          # silently reading an empty 'dev:' keyspace instead of the real
          # counters - the digest could only ever report zeros. Same fix
          # scripts/tenant-admin.mjs's own header comment already documents
          # for laptop-shell CLI runs: export VERCEL_ENV=production explicitly.
          VERCEL_ENV: production
          # The pipeline-health report runs inside this same script (additive,
          # failure-tolerant). It needs no secret of its own — `gh` uses
          # GITHUB_TOKEN above — but it does need `actions: read`, granted at
          # the job's permissions block.
        run: npx tsx scripts/daily-metrics.mjs

      # ---------------------------------------------------------------
      # Secrets health. workflow_dispatch ONLY, and off by default, because
      # it is the one step here that touches a credential at all.
      #
      # WHAT IT PRINTS, EXHAUSTIVELY: the database's role (a literal in this
      # file), the HTTP status of a /ping, and the FIRST EIGHT CHARACTERS of
      # the hostname. Never a token. Never a full URL. Never a response body.
      # curl writes only `%{http_code}` and sends its body to /dev/null, so
      # there is no wording of a reply that can reach the log.
      #
      # Why it exists: a rotated-but-not-updated Upstash token fails SILENTLY
      # in production — lib/upstash.ts's counters/cache paths fail OPEN to
      # in-memory by design, so the site stays up and the digest simply reads
      # zeros. This is the one-command answer to "are the three tokens still
      # good", without ever putting one in front of a human.
      # ---------------------------------------------------------------
      - name: Secrets health (Upstash /ping — status + 8 hostname chars only)
        if: github.event_name == 'workflow_dispatch' && inputs.secrets_health
        env:
          COUNTERS_URL: ${{ secrets.UPSTASH_COUNTERS_REST_URL }}
          COUNTERS_TOKEN: ${{ secrets.UPSTASH_COUNTERS_REST_TOKEN }}
          CACHE_URL: ${{ secrets.UPSTASH_CACHE_REST_URL }}
          CACHE_TOKEN: ${{ secrets.UPSTASH_CACHE_REST_TOKEN }}
          TENANCY_URL: ${{ secrets.UPSTASH_TENANCY_REST_URL }}
          TENANCY_TOKEN: ${{ secrets.UPSTASH_TENANCY_REST_TOKEN }}
        run: |
          ping_one() {
            role="$1"; url="$2"; token="$3"
            if [ -z "$url" ] || [ -z "$token" ]; then
              echo "${role}: not configured in this environment"
              return 0
            fi
            # Host fragment only: strip the scheme, drop everything from the
            # first slash, keep 8 characters. An Upstash hostname carries a
            # database id, so 8 characters is a fingerprint, not an address.
            host8=$(printf '%s' "$url" | sed -E 's#^https?://##; s#/.*##' | cut -c1-8)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
                   -H "Authorization: Bearer ${token}" "${url}/ping" || echo "000")
            echo "${role}: host=${host8}… status=${code}"
          }
          ping_one counters "$COUNTERS_URL" "$COUNTERS_TOKEN"
          ping_one cache    "$CACHE_URL"    "$CACHE_TOKEN"
          ping_one tenancy  "$TENANCY_URL"  "$TENANCY_TOKEN"
          echo "A 200 means the URL and token still pair. 401/403 means the token was rotated without updating this repo's secret. 000 means the request never completed."
